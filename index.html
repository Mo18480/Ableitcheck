/* Version 2 – live Viertelkreisprüfung mit bemaßtem maßstäblichen SVG-Schnitt */
.q-panel{background:#fbfdff;border-color:#cbdde9;margin-top:22px;padding:20px}
.q-rechenschritte{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:19px 0 10px}
.q-metric{border:1px solid #dce6ed;border-radius:10px;background:white;padding:11px 12px;min-width:0}
.q-metric small{color:#627c90;display:block;font-size:11px;font-weight:700;min-height:29px}
.q-metric b{color:#1e405a;display:block;font-size:21px;line-height:1.3;margin:4px 0 6px}
.q-metric span{font-size:11.5px;line-height:1.35;display:block;color:#647d8b}
.q-metric-highlight{background:#e7f2fa;border-color:#9ec7e1}
.q-metric-highlight b{color:#116492}
.q-formula{padding:10px 12px;background:#eff6fa;border-radius:8px;font-size:12px;color:#4e697d;margin-bottom:14px}
.quarter-figure{margin:16px 0 12px;padding:10px;background:#fff;border:1px solid #d5e3ed;border-radius:12px}
.quarter-figure svg{width:100%;height:auto;display:block;max-height:500px;overflow:visible}
.q-title{font:700 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#27475f}
.q-label{font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#355c72}
.q-small{font:12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#46677c}
.q-dim{font:700 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1671a8}
.q-axis-text{font:11px system-ui,-apple-system,Segoe UI,sans-serif;fill:#79909f}
.quarter-figcaption{font-size:12px;color:#49687d;padding:8px 5px 2px;line-height:1.4}
.q-dot{display:inline-block;height:9px;width:9px;border-radius:50%;margin-right:8px}
.quarter-placeholder{padding:28px;background:#f1f7fb;border:1px dashed #aac8da;border-radius:9px;color:#4d6d82}
.quarter-placeholder p{margin:7px 0 0;font-size:12px}
.q-analysis{background:#fff;padding:16px 18px;border:1px solid #d9e5ec;border-radius:9px;margin-top:12px}
.q-analysis h3{margin:0}
.q-data-row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #ebf0f4;padding:8px 0;gap:14px;font-size:12px}
.q-data-row strong{text-align:right;color:#2b4e64;flex-shrink:0}
.q-balance{background:#f2f7fb;padding:10px;border:1px solid #d8e8f1;border-radius:5px;margin-top:7px}
.q-table-note{font-size:11px;color:#607789;line-height:1.5;margin-top:13px}
.rquarter{break-inside:avoid-page;border:1px solid #dbe5ec;padding:8px 12px;margin:14px 0}
.rquarter h3{font-size:13px;margin:4px 0}
.rquarter p{font-size:10px;margin:5px 0}
.rquarter .quarter-figure{margin:7px 0;padding:2px;border:0}
.rquarter .quarter-figcaption{font-size:9px}
@media(max-width:1200px){.q-rechenschritte{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:670px){.q-rechenschritte{grid-template-columns:repeat(2,minmax(0,1fr))}.q-metric b{font-size:17px}.q-panel{padding:12px}.q-data-row{align-items:flex-start}.q-data-row strong{max-width:45%}}
@media print{.rquarter{break-inside:avoid}.rquarter .quarter-figure svg{max-height:76mm}.rquarter .q-title{font-size:18px}}
.status.grenzfall{color:#8c6424;background:#fff4db}

/* Die automatische Winkelberechnung wird unmittelbar am Aufmaß gezeigt. */
.angle-card{margin:14px 0 18px;padding:16px;border:1px solid #b8d9cc;border-left:5px solid #177b5a;border-radius:10px;background:#f2faf6;color:#213e3b}
.angle-card.angle-warning{background:#fff9ec;border-color:#e5c999;border-left-color:#ac7528;color:#594629}
.angle-inline{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.angle-inline small{font-size:12px;color:#5d7482;display:block}.angle-inline strong{font-size:25px;letter-spacing:-.5px}
.angle-formula{font-size:12px;font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere;margin-top:12px;padding:8px;background:#ffffffb9;border-radius:5px}
.angle-card p{margin:8px 0 0;font-size:12px;line-height:1.45}
@media(max-width:560px){.angle-inline{grid-template-columns:1fr}.angle-inline strong{font-size:22px}}
@media print{.angle-card{break-inside:avoid}}

/* V3.8: Erklärungen auf Abruf, VDI-Ergebnis */
.infobtn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:7px;border-radius:50%;border:1px solid #9cc0d8;background:#fff;color:#1d6a9c;font:italic 700 13px Georgia,serif;vertical-align:middle;padding:0;position:relative}
.infobtn::after{content:'';position:absolute;inset:-10px}
.infobtn[aria-expanded="true"]{background:#1d6a9c;color:#fff;border-color:#1d6a9c}
.field small.hint{background:#f3f8fb;border-radius:6px;padding:7px 9px;font-size:12px;color:#3f5f73;margin-top:6px}
.field small.hint[hidden]{display:none}
.field input,.field select{min-height:50px}
details.more{margin-top:12px}details.more>summary{cursor:pointer;color:#1d6a9c;font-weight:650;font-size:13px;padding:6px 0;list-style-position:inside}
details.more.card>summary{font-size:14px}
.vdi-panel{margin-top:14px;padding:16px 18px;border:1px solid #d6cbe8;border-left:5px solid #6b4fa0;border-radius:10px;background:#fbf9fe}
.vdi-panel h3{margin:0}
.vdi-card{border-top:4px solid #6b4fa0}
.vdi-metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin:14px 0}
.vdi-metrics .metricvalue{font-size:24px;font-weight:800;color:#1e405a}
.metric-hl{background:#efe9f8;border-color:#c9b8e6}
.metric-hl .metricvalue{color:#4f3684!important}
@media(max-width:900px){.vdi-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* V3.8: Prüfprotokoll im Stil der Bescheinigungen (Arial, schwarze Rahmen). Alle Größen in em: beim Drucken wird die Schrift so gewählt, dass die A4-Seite gefüllt ist. */
.pform{font-family:Arial,Helvetica,sans-serif;color:#000;font-size:8.6pt;line-height:1.25}
.pform table{border-collapse:collapse;width:100%;margin:0 0 -1px;table-layout:fixed}
.pform td,.pform th{border:1px solid #000;padding:.3em .55em;vertical-align:top;background:#fff;font-weight:normal;text-align:left}
.pf-head{display:grid;grid-template-columns:1fr 92mm;gap:6mm;margin-bottom:.9em}
.pf-addr{font-size:1.22em;line-height:1.3}.pf-contact{font-size:.93em;margin-top:.6em;line-height:1.3}
.pf-return{font-size:.76em;text-decoration:underline;margin:1em 0 1.1em}.pf-recipient{font-size:1.16em;line-height:1.35;min-height:4.9em}
.pf-side{border:1px solid #000}.pf-sline{font-size:1.16em;padding:.35em .55em;border-bottom:1px solid #000}
.pf-checks{padding:.5em .65em;border-bottom:1px solid #000}.pf-tiny{font-size:.76em;padding:.25em .8em 0}.pf-place{font-size:1.1em;padding:.1em .55em .45em}
.pf-cb{display:flex;gap:.55em;align-items:flex-start;margin:.2em 0}.pf-box{display:inline-flex;align-items:center;justify-content:center;width:1.1em;height:1.1em;min-width:1.1em;border:1px solid #000;font-size:1em;line-height:1;font-weight:bold;margin-top:.1em}
.pf-title .pf-t{width:52mm;font-size:1.98em;font-weight:bold;text-align:center;vertical-align:middle;padding:.35em}.pf-title .pf-d{font-size:.88em;text-align:justify}
.pf-grid,.pf-ynt,.pf-nb,.pf-res,.pf-foot{margin-top:.45em!important}.pf-lbl{font-size:.81em}.pf-val{font-size:1.05em;text-align:center}
.pf-ynt td.pf-yn{width:4.4em;white-space:nowrap}.pf-ynt td.pf-note{width:6.8em;font-size:.81em;color:#333}
.pf-sub{font-size:.84em;margin-top:.1em}

<script type="module">

// AbleitCheck • Fachlicher Prüf- und Rechenkern | §19 1. BImSchV / LAI 13.03.2026 / VDI 3781 Blatt 4:2017-07
// Reine Funktionen: keine DOM- oder Speicherzugriffe. Maße in m; Höhenniveau: Betreiber-Gelände.
const APP_VERSION = '3.9';
const RULE_DATE = '17.11.2026 · V'+APP_VERSION;
const SOURCES = {
  law: 'https://www.gesetze-im-internet.de/bimschv_1_2010/__19.html',
  lai: 'https://www.lai-immissionsschutz.de/documents/auslegungsfragenkatalog-1-bimschv_1776414460.pdf'
};
const N = value => {
  if (value === '' || value === null || value === undefined) return null;
  if (typeof value === 'number') return Number.isFinite(value) ? value : null;
  const str = String(value).trim().replace(/^\s+|\s+$/g, '').replace(',', '.');
  if (!/^[-+]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(str)) return null;
  const n = Number(str); return Number.isFinite(n) ? n : null;
};
const valid = (...x) => x.every(v => v !== null && Number.isFinite(v));
const rounded = x => x === null || !Number.isFinite(x) ? null : Math.round(x*1000)/1000;
const fmt = x => x === null || x === undefined || !Number.isFinite(x) ? '–' : Number(x).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const blankProject = () => ({
  id: 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
  createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), closedAt: null,
  schemaVersion:32, migrationNotice:'', migrationAck:false, status: 'entwurf',
  general: {address:'', owner:'', date:new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Berlin'}), examiner:'', plant:'', caseType:'', power:'', notes:'', vdiShow:'auto', ownerAddress:'', role:'hoheitlich', uvBuilt:'unk', uv1:'unk', uv2:'unk', uv3:'unk', uv4:'unk'},
  building: {roof:'sattel', pitchMode:'auto', pitch:'', gable:'', length:'', eaves:'', ridge:'', chimney:'', distRidge:'', distEaves:'', roofClearance:'', roofHorizontal:'', walmEqual:'unk', chimE:'', chimN:'', geoAddr:'', geoLat:'', geoLon:'', geoH:'', geoInfo:'', notes:''},
  openings: [], openingsSurvey:'unk',
  neighbors:[],
  environment:{survey:'unk', larger:'unk', largerRecorded:'unk', complex:'unk', slope:'unk', accuracy:'unk', notes:''},
  photos:[], finalNotes:''
});
const blankOpening = () => ({id:'o'+Math.random().toString(36).slice(2,9),type:'Fenster',building:'',distance:'',top:''});
const blankNeighbor = () => ({id:'n'+Math.random().toString(36).slice(2,9), kind:'einzel', name:'', positionNotes:'', roof:'sattel', pitchMode:'auto', pitch:'',gable:'', length:'', eaves:'',ridge:'',distance:'',delta:'',beta:'',facing:'giebel',orient:'',aerialInfo:'',address:'',geoLat:'',geoLon:'',geoH:'',geoInfo:'',deltaSource:'',notes:''});
// Ergänzt fehlende Felder neuerer Versionen (z. B. V3.8 VDI-Angaben) ohne Werte zu ändern.
function fillDefaults(p){
  if(!p)return p;const d=blankProject();
  for(const k of ['general','building','environment'])p[k]={...d[k],...(p[k]||{})};
  p.neighbors=(p.neighbors||[]).map(n=>{const x={...blankNeighbor(),...n};if(n.orient===undefined&&N(x.beta)!==null)x.orient='schraeg';return x;});
  return p;
}
// Winkel aus gemessener Dachgeometrie für ein symmetrisches Satteldach.
// pitchMode: auto = Winkel aus First/Traufe/Breite; measured = Feld "gemessener Winkel".
// Legacy-Projekte ohne pitchMode bleiben zunächst im gemessenen Modus.
function angleFactorClass(degrees){
  if(!Number.isFinite(degrees))return null;
  return degrees<20-1e-8?'0-<20':degrees<30-1e-8?'20-<30':degrees<45-1e-8?'30-<45':degrees<60-1e-8?'45-<60':'≥60';
}
function roofAngle(record){
  const mode=record.pitchMode==='auto'?'auto':'measured';
  const measured=N(record.pitch),width=N(record.gable),ridge=N(record.ridge),eaves=N(record.eaves);
  if(record.roof==='flach')return {status:'ok',mode:'fixed',used:0,calculated:0,measured,conflict:false,reason:'Flachdach: Dachneigung 0°.'};
  if(record.roof==='shed')return {status:'ok',mode:'fixed',used:0,calculated:0,measured,conflict:false,reason:'Sheddach: wie Flachdach mit Höhe der Sheds (VDI 3781 Blatt 4, 6.2.1.2.6).'};
  if(!['sattel','walm','pult'].includes(record.roof))return {status:'manuell',mode,used:measured,calculated:null,measured,conflict:false,reason:'Automatische Winkelberechnung nur für Sattel-, Walm- und Pultdächer.'};
  const geometryValid=valid(width,ridge,eaves)&&width>0&&ridge>eaves&&eaves>=0;
  // Pultdach: Höhenunterschied über die ganze Breite; Satteldach/Walmdach: über die halbe Giebelbreite (Walm: schmale Seite).
  const run=record.roof==='pult'?width:width/2;
  const calculated=geometryValid?Math.atan2(ridge-eaves,run)*180/Math.PI:null;
  const used=mode==='auto'?calculated:measured;
  const difference=calculated!==null&&valid(measured)&&measured>=0&&measured<90?Math.abs(calculated-measured):null;
  // Datenqualität aus der Schulung: Winkelgenauigkeit 5°. Auch Sprung über eine LAI-Faktorgrenze ist relevant.
  const changesFactor=difference!==null&&angleFactorClass(measured)!==angleFactorClass(calculated);
  const conflict=difference!==null&&(difference>5+1e-8||changesFactor);
  let status='ok',reason='';
  if(mode==='auto'&&calculated===null){status='offen';reason=record.roof==='pult'?'Für die automatische Dachneigung: Gebäudebreite (in Gefällerichtung), hohe und niedrige Traufhöhe eintragen.':'Für die automatische Dachneigung: Giebelbreite > 0 und First-/Traufhöhe über demselben Gelände-Bezug mit First > Traufe eintragen.';}
  else if(mode==='measured'&&(!valid(measured)||measured<=0||measured>=90)){status='offen';reason='Gemessenen Dachwinkel zwischen 0° und 90° eintragen oder automatische Berechnung auswählen.';}
  if(conflict){
    reason=`Widerspruch: gemessen ${fmt(measured)}°, aus Gebäudegeometrie ${fmt(calculated)}° (Differenz ${fmt(difference)}°). ${changesFactor?'Unterschiedliche Zuschlagsstufen. ':''}Maße/Dachform prüfen oder den fehlerhaften Winkel berichtigen; bis dahin keine automatische Positivfreigabe.`;
  }
  return {status,mode,used,calculated,measured,difference,conflict,changesFactor,reason};
}
function anglePanel(record){
  const a=roofAngle(record);
  if(record.roof==='flach'||record.roof==='shed')return '';
  if(!['sattel','walm','pult'].includes(record.roof))return '<div class="angle-card angle-warning">Bei dieser Dachform keine automatische Berechnung. Geometrie gesondert beurteilen (Einzelfall).</div>';
  const values=a.calculated===null?'Noch nicht berechenbar':fmt(a.calculated)+'°';
  const diff=a.difference===null?'Kein gemessener Vergleichswert hinterlegt':`Gemessener Winkel: ${fmt(a.measured)}° · Abweichung: ${fmt(a.difference)}°`;
  const active=a.used===null?'Noch nicht verfügbar':fmt(a.used)+'°';
  return `<div class="angle-card ${a.conflict||a.status!=='ok'?'angle-warning':''}"><div class="angle-inline"><div><small>Aus Höhen und Giebelbreite berechnet</small><strong>${values}</strong></div><div><small>Für die Prüfung verwendeter Winkel</small><strong>${active}</strong></div></div><div class="angle-formula">${record.roof==='pult'?'α = arctan((hohe Seite − niedrige Seite) ÷ Gebäudebreite)':'α = arctan((Firsthöhe − Traufhöhe) ÷ (Giebelbreite / 2))'}</div><p>${diff}. ${a.mode==='auto'?'Die App verwendet den berechneten Winkel.':'Die App verwendet den direkt gemessenen Winkel.'}</p>${a.reason?`<p><strong>${a.reason}</strong></p>`:''}</div>`;
}
// Anwendungsfall. Unverhältnismäßigkeit nach Prüffolge LIV BW, Arbeitshilfe 07.06.2023 (Diagramm 4).
function effectiveCase(g){
  const t=g.caseType;
  if(t==='neu')return {type:'neu',label:'Errichtung ab 01.01.2022 (§ 19 Abs. 1)',note:''};
  if(t==='bestand')return {type:'bestand',label:'Wesentliche Änderung / Austausch / Ersatz Öl-Gas (§ 19 Abs. 2)',note:''};
  if(t==='keine')return {type:'keine',label:'Wartung / Reparatur / Instandsetzung – § 19 nicht anzuwenden',note:'Wartung, Reparatur oder Instandsetzung sind weder Errichtung noch wesentliche Änderung oder Austausch; eine Anpassung nach § 19 ist dann nicht erforderlich (LIV-Arbeitshilfe 2023). Einordnung bitte unter Notizen begründen.'};
  if(t==='sonder')return {type:'sonder',label:'Sonderfall – fachlich klären',note:''};
  if(t==='unverh'){
    const base='Bestandsgebäude, Unverhältnismäßigkeit geprüft (§ 19 Abs. 1 Satz 7)';
    const abs1=note=>({type:'neu',via:'unverh',label:base+' → § 19 Abs. 1',note});
    const abs2=note=>({type:'bestand',via:'unverh',label:base+' → § 19 Abs. 2',note:note+' Auch hier prüfen, ob schädliche Umwelteinwirkungen zu befürchten sind; ist eine Erhöhung mit angemessenem Aufwand möglich, darauf hinwirken (UM BW 21.12.2021).'});
    const open=n=>({type:'',via:'unverh',label:base+' – noch offen',note:`Unverhältnismäßigkeitsprüfung: ${n} beantworten.`});
    if(g.uvBuilt==='nein')return {type:'neu',via:'unverh',label:'Errichtung ab 01.01.2022 (§ 19 Abs. 1) – Satz 7 nicht anwendbar',note:'Gebäude weder vor 2022 errichtet noch vor 2022 genehmigt: Satz 7 nicht anwendbar, Absatz 1 gilt.'};
    if(g.uvBuilt!=='ja')return open('Frage 0 (Errichtung / Baugenehmigung vor 2022)');
    if(g.uv1==='ja')return abs1('Abs. 1 mit nicht schwingungsanfälliger Abgasanlage einhaltbar: i. d. R. keine Unverhältnismäßigkeit.');
    if(g.uv1!=='nein')return open('Frage 1');
    if(g.uv2==='ja')return abs2('Ausreichende Verdünnung durch Abstand oder andere Maßnahmen: i. d. R. Unverhältnismäßigkeit.');
    if(g.uv2!=='nein')return open('Frage 2');
    if(g.uv3==='ja')return abs1('Abs. 1 mit schwingungsanfälliger Abgasanlage einhaltbar: i. d. R. keine Unverhältnismäßigkeit.');
    if(g.uv3!=='nein')return open('Frage 3');
    if(g.uv4==='ja')return abs2('Anlage für Raumheizung/Warmwasser erforderlich, keine andere Wärmeerzeugung möglich: i. d. R. Unverhältnismäßigkeit.');
    if(g.uv4!=='nein')return open('Frage 4');
    return abs1('Kein Grund für Unverhältnismäßigkeit nach der Prüffolge: i. d. R. Anwendung Abs. 1.');
  }
  return {type:'',label:'nicht festgelegt',note:'Anwendungsfall auswählen.'};
}
// Abschlusssatz zur VDI 3781 Blatt 4 – abhängig vom Ergebnis der LAI-Prüfschritte.
function vdiNote(c){
  const t=c&&c.case?c.case.type:'';
  if(t==='keine')return '';
  const v=c.vdi, r621=c.roof&&c.roof.via==='vdi621'?' Die Höhe über dem eigenen Dach wurde nach VDI 3781 Blatt 4 Abschnitt 6.2.1 bestimmt (§ 19 Abs. 1 Satz 4).':'';
  if(t==='neu'&&v&&v.required){
    if(v.status==='ok'||v.status==='nein')return `Grundlage sind § 19 Abs. 1 der 1. BImSchV, die vereinfachte Prüfung nach LAI (Prüfschritte 1–3) und die danach erforderliche Berechnung nach VDI 3781 Blatt 4 (Abschnitte 6.2 und 6.3): Mindesthöhe ${fmt(v.HM)} m über First (${fmt(v.requiredMouth)} m über Gelände).`+r621;
    return 'Nach den LAI-Prüfschritten ist eine Berechnung nach VDI 3781 Blatt 4 erforderlich; die Angaben dafür sind noch unvollständig.'+r621;
  }
  if(t==='neu')return 'Grundlage sind § 19 Abs. 1 der 1. BImSchV und die vereinfachte Prüfung nach LAI (Prüfschritte 1–3). Eine weitergehende Berechnung nach VDI 3781 Blatt 4 war danach nicht erforderlich und wurde nicht durchgeführt.'+r621;
  if(t==='bestand')return 'Grundlage ist § 19 Abs. 2 der 1. BImSchV. Eine Berechnung nach VDI 3781 Blatt 4 ist dafür nicht vorgeschrieben'+(v&&valid(v.HM)?`; informativ ergibt sie eine Mindesthöhe von ${fmt(v.HM)} m über First (${fmt(v.requiredMouth)} m über Gelände).`:' und wurde nicht durchgeführt.');
  return 'Eine Berechnung nach VDI 3781 Blatt 4 wurde nicht durchgeführt.';
}
function openingRequirement(caseType,power){
  if (!valid(power)||power<=0) return {status:'offen',reason:'Gesamtwärmeleistung fehlt oder ist ungültig.'};
  if(caseType==='neu'){
    if(power<=50)return {status:'ok',radius:15,over:1};
    if(power<=100)return {status:'ok',radius:17,over:2};
    if(power<=150)return {status:'ok',radius:19,over:3};
    if(power<=200)return {status:'ok',radius:21,over:3};
    const t=vdiTable3(power);return {status:'ok',radius:t.radius,over:t.over,source:'VDI 3781 Blatt 4, Tabelle 3 (§ 19 Abs. 1 Satz 5)'};
  }
  if(caseType==='bestand')return {status:'ok',radius:Math.min(40,15+2*Math.ceil(Math.max(0,power-50)/50)),over:1};
  return {status:'offen',reason:'Anwendungsfall Absatz 1 / Absatz 2 ist nicht festgelegt.'};
}
function roofCheck(g,b){
  const typ=g.caseType, roof=b.roof, angle=roofAngle(b), pitch=angle.used, gable=N(b.gable), eaves=N(b.eaves), ridge=N(b.ridge), h=N(b.chimney),a=N(b.distRidge), d=N(b.distEaves);
  const result={status:'offen', title:'Dach-/Mündungsanforderung', lines:[], values:{}, note:''};
  const finish=()=>{
    result.angle=angle;
    if(angle.conflict && result.status==='ok'){
      result.status='offen';result.note=angle.reason+' Rechnerischer Vorbefund bitte nicht als Nachweis verwenden.';
    }
    return result;
  };

  if(!typ){result.note=g.caseNote||'Anwendungsfall auswählen.';return finish();}
  if(typ==='sonder'){result.status='manuell';result.note='Sonderfall (z. B. Unverhältnismäßigkeit): rechtlich gesondert begründen; keine automatisierte Freigabe.';return finish();}
  if([h,eaves,ridge,gable,a,d,N(b.roofClearance),N(b.roofHorizontal)].some(v=>v!==null&&v<0)||pitch!==null&&(pitch<0||pitch>=90)||valid(eaves,ridge)&&ridge<eaves){result.note='Unplausible Geometrie: negative Maße, First unter Traufe oder Dachneigung außerhalb 0 bis unter 90°. Eingaben korrigieren.';return finish();}
  if(!valid(h)){result.note='Mündungshöhe über dem Gelände-Bezugsniveau fehlt.';return finish();}
  if(typ==='neu'){
    const HU=vdiHU(N(g.power));
    // § 19 Abs. 1 Satz 4: Abweichung von Satz 1–3 nur, wenn die Höhe für das Einzelgebäude nach VDI 3781 Blatt 4 Abschnitt 6.2.1 bestimmt ist.
    const viaVDI=(intro,ruleFailed)=>{
      const v=vdiSingle(b,b.distRidge,HU);result.vdi=v;
      if(v.status!=='ok'){
        if(!ruleFailed){result.status=v.status==='manuell'?'manuell':'offen';result.note=intro+' '+v.reason;}
        else result.note=(result.note?result.note+' ':'')+'Alternative nach VDI 3781 Blatt 4 Abschnitt 6.2.1 noch nicht berechenbar: '+v.reason;
        return finish();

function openingsCheck(project,caseType=project.general.caseType){

    if(req.status==='ok'&&valid(dist,top,chimney)&&dist>=0){

// Vereinfachter LAI-Viertelkreis gemäß Schulungsfolie 21 (kein VDI-Vollnachweis).

function quarterRadius(nb){
  const angle=roofAngle(nb), pitch=angle.used;
  // Walmdach wie Satteldach (schmale Seite als Giebel), Schulung Folie 21 Fußnote.
  const roof=nb.roof==='walm'?'sattel':nb.roof;
  const eaves=N(nb.eaves),ridge=N(nb.ridge),gable=N(nb.gable);
  if(roof==='pult'||roof==='shed'){
    // Schulung Folie 21 Fußnote: Pult-/Sheddach über Höhe eines fiktiven 20°-Dachs über First (entspricht VDI 3781 Blatt 4 Gl. 10).
    if(!valid(ridge)||ridge<=0)return {status:'offen',pitchInfo:angle,reason:roof==='pult'?'Firsthöhe (hohe Seite) des Pultdachs fehlt.':'Firsthöhe (Oberkante der Sheds) fehlt.'};
    if(!valid(gable)||gable<=0)return {status:'offen',pitchInfo:angle,reason:roof==='pult'?'Gebäudebreite in Gefällerichtung fehlt.':'Schmalseite b des Gebäudes fehlt.'};
    const fictive=(gable/2)*Math.tan(20*Math.PI/180),radius=ridge+fictive;
    return {status:'ok',pitchInfo:angle,radius:rounded(radius),rawRadius:radius,baseHeight:ridge,rise:rounded(fictive),surcharge:rounded(fictive),fictive:rounded(fictive),factor:1,
      formula:'Firsthöhe + Höhe eines fiktiven 20°-Dachs (b/2 × tan 20°)',roofLabel:roof==='pult'?'Pultdach':'Sheddach'};
  }
  if(roof!=='sattel' && roof!=='flach') return {status:'manuell',pitchInfo:angle,reason:'Andere/komplexe Dachform: auf einfache Dachformen zurückführen oder gesondert bewerten. Keine automatische Viertelkreisfreigabe.'};
  if(!valid(eaves)||eaves<0) return {status:'offen',pitchInfo:angle,reason:'Traufhöhe über dem Nachbargelände fehlt.'};
  if(roof==='sattel'&&angle.status!=='ok')return {status:'offen',pitchInfo:angle,reason:angle.reason};
  if(pitch===null||pitch<0||pitch>=90) return {status:'offen',reason:'Gültige Dachneigung (0–90°) fehlt.'};
  if(roof==='sattel'&&pitch===0)return {status:'offen',reason:'0° als Flachdach erfassen; Satteldach erfordert positive Neigung.'};
  if(valid(ridge)&&ridge<eaves)return {status:'offen',reason:'First liegt unter Traufe.'};
  if(roof==='flach'||pitch<20-1e-8){
    if(!valid(gable)||gable<=0)return {status:'offen',reason:'Gebäudebreite für das fiktive 20°-Dach fehlt (Flachdach: Schmalseite b, sonst Giebelbreite).'};
    const fictive=(gable/2)*Math.tan(20*Math.PI/180);
    const factor=roof==='flach'?1:1.85;
    const surcharge=factor*fictive;
    const radius=eaves+surcharge;
    return {status:'ok',pitchInfo:angle,radius:rounded(radius),rawRadius:radius,baseHeight:eaves,
      rise:rounded(fictive),surcharge:rounded(surcharge),fictive:rounded(fictive),
      factor, formula:roof==='flach'?'Traufhöhe + Höhe des fiktiven 20°-Dachs':
      'Traufhöhe + 1,85 × Höhe des fiktiven 20°-Dachs',
      roofLabel:roof==='flach'?'Flachdach':'Dachneigung unter 20°'};
  }
  if(!valid(ridge)||ridge<=eaves) return {status:'offen',reason:'Firsthöhe fehlt oder liegt unterhalb der Traufhöhe.'};
  const factor=pitch<30-1e-8?.85:pitch<45-1e-8?.7:pitch<60-1e-8?.5:.45;
  const rise=ridge-eaves, surcharge=factor*rise, radius=ridge+surcharge;
  return {status:'ok',pitchInfo:angle,radius:rounded(radius),rawRadius:radius,baseHeight:ridge,
    rise:rounded(rise),surcharge:rounded(surcharge),fictive:null,factor,
    formula:`Firsthöhe + ${String(factor).replace('.',',')} × (Firsthöhe – Traufhöhe)`,
    roofLabel:`${fmt(pitch)}° Dachneigung`};
}

function neighborCheckRaw(nb,ownChimney){

    result.step1='nicht erforderlich';

  } else {
    if(!valid(ridge)){result.reason='Nachbar-Firsthöhe für Prüfschritt 1 fehlt.';return result;}

  }

  result.surcharge=q.surcharge;
  if(!valid(dist)||dist<0){result.status=result.step1==='ok'?'hinweis':'offen';result.reason='Horizontaler Abstand d von der Mündung zur nächstgelegenen Nachbar-Gebäudekante fehlt.';return result;}

  result.details.push(`Abstand Mündung – Kreismittelpunkt = ${fmt(separation)} m; Abstand zum Kreisbogen (radial) = ${fmt(gap)} m.`);
  if(result.arcHeight!==null)result.details.push(`Kreisbogen auf Mündungsposition: ${fmt(result.arcHeight)} m über eigenem Gelände.`);

  else if(cs.type==='neu'){
    const envOpen=e.survey!=='ja'||!['ja','nein'].includes(e.larger)||e.complex!=='nein'||e.slope!=='ja'||e.accuracy!=='ja';
    if(e.complex==='ja'){lai.status='manuell';lai.notes.push('Komplexe Dach-, Gebäude- oder Geländeform: Einzelfalluntersuchung (VDI 3781 Blatt 4, 5.4).');}
    else if(neighbors.some(n=>n.status==='manuell')){lai.status='manuell';lai.notes.push('Mindestens ein Nachbargebäude braucht eine Einzelprüfung (Dachform).');}
    else if(required&&vdi.status==='nein'){lai.status='nein';lai.notes.push(`Berechnung nach VDI 3781 Blatt 4: Mündung mindestens ${fmt(vdi.HM)} m über First erforderlich (${fmt(vdi.requiredMouth)} m über Gelände), vorhanden ${fmt(vdi.actual)} m über First.`);}
    else if(required&&e.larger==='ja'&&e.largerRecorded!=='ja'){lai.status='vdi';lai.notes.push('Prüfschritt 3: deutlich größere Gebäude im 50-m-Umfeld als Nachbargebäude erfassen und bestätigen, damit die VDI-Berechnung sie enthält.');}
    else if(required&&vdi.status!=='ok'){lai.status='vdi';lai.notes.push('Berechnung nach VDI 3781 Blatt 4 erforderlich; Angaben ergänzen: '+vdi.missing.join(' · '));}
    else if(envOpen||neighbors.some(n=>['offen','hinweis','vdi'].includes(n.status))){lai.status='offen';lai.notes.push('Umgebungserfassung, Gelände/Komplexität oder eine Nachbarprüfung ist noch offen.');}
    else if(required){lai.status='ok';lai.notes.push(`Berechnung nach VDI 3781 Blatt 4: erforderlich ${fmt(vdi.HM)} m über First, vorhanden ${fmt(vdi.actual)} m – erfüllt.`);}
    else {lai.status='ok';lai.notes.push('Vereinfachtes LAI-Verfahren ohne Auffälligkeiten; eine Berechnung nach VDI 3781 Blatt 4 ist danach nicht erforderlich.');}
  }
  let overall='offen'; let headline='Prüfung unvollständig';
  if(roof.status==='nein'||openings.status==='nein'||lai.status==='nein'){overall='nein';headline=lai.status==='nein'&&roof.status!=='nein'&&openings.status!=='nein'?'Mindesthöhe nach VDI 3781 Blatt 4 nicht erreicht':'Gesetzliche Grundanforderung nicht erfüllt';}
  else if(roof.status==='manuell'||openings.status==='manuell'||lai.status==='manuell'){overall='manuell';headline='Fachlicher Einzelnachweis notwendig';}
  else if(lai.status==='vdi'){overall='vdi';headline='Berechnung nach VDI 3781 Blatt 4: Angaben ergänzen';}
  else if(roof.status==='ok'&&openings.status==='ok'&&(lai.status==='ok'||lai.status==='nicht erforderlich')){overall='ok';headline=vdi&&vdi.required?'Prüfung mit VDI-Berechnung ohne Auffälligkeit':'Prüfung ohne Auffälligkeit';}
  return {case:cs,roof,openings,neighbors,lai,vdi,overall,headline};
}

// ------- vdi.mjs -------
// VDI 3781 Blatt 4 (2017-07, bestätigt 2023): eigene Umsetzung der Rechenformeln.
// Gleichungs- und Abschnittsnummern dienen der Nachvollziehbarkeit; kein Richtlinientext.
// Alle Höhen in m über dem eigenen Gelände (Bezugspunkt: Lot unter dem First). Nachbarhöhen über Nachbargelände, Δh = Nachbar − eigenes Gelände.
const TAN20=Math.tan(20*Math.PI/180);
const deg=x=>x*Math.PI/180;
const r1=x=>x===null||x===undefined||!Number.isFinite(x)?null:Math.round(x*100)/100;
// Tab. 2: Dachneigungskorrektur γ und Faktor f, Zwischenwerte linear interpoliert.
function vdiTable2(alpha){
  const t=[[20,0,.85],[30,0,.70],[45,10,.50],[60,20,.45]];
  if(alpha<=20)return {gamma:0,f:.85};
  if(alpha>=60)return {gamma:20,f:.45};
  for(let i=0;i<t.length-1;i++){const [a0,g0,f0]=t[i],[a1,g1,f1]=t[i+1];if(alpha<=a1){const k=(alpha-a0)/(a1-a0);return {gamma:g0+k*(g1-g0),f:f0+k*(f1-f0)};}}
}
// Tab. 1: additiver Term H_Ü (Feuerungsanlagen 1. BImSchV).
function vdiHU(power){
  if(!valid(power)||power<=0)return null;
  return power<=400?0.4:power<1000?1.0:3.0;
}
// Tab. 3 (feste Brennstoffe): Radius R des Einwirkungsbereichs und Mündungshöhe H_S über Bezugsniveau.
function vdiTable3(power){
  if(!valid(power)||power<=0)return null;
  const radius=Math.min(50,15+2*Math.ceil(Math.max(0,power-50)/50-1e-9));
  const over=power<=50?1:power<=100?2:power<=200?3:power<=400?4:5;
  return {radius,over};
}
const ROOF_LABEL={sattel:'Satteldach',walm:'Walm-/Zeltdach',flach:'Flachdach',pult:'Pultdach',shed:'Sheddach',andere:'andere Dachform'};
// Dachmodell eines Gebäudes für Abschnitt 6.2.1: Bezugshöhe „First“, Dachhöhe, Neigung, Breite b.
function vdiRoofModel(rec){
  const roof=rec.roof||'sattel', eaves=N(rec.eaves), ridge=N(rec.ridge), b=N(rec.gable), len=N(rec.length);
  const m={ok:false,roof,label:ROOF_LABEL[roof]||roof,b,len,reason:''};
  if(roof==='andere'){m.manual=true;m.reason='Andere/komplexe Dachform: nach VDI 3781 Blatt 4 Abschnitt 5.4 Einzelfall (z. B. auf einfache Formen zurückführen).';return m;}
  if(!valid(b)||b<=0){m.reason=roof==='flach'||roof==='shed'?'Schmalseite b des Gebäudes fehlt.':roof==='pult'?'Gebäudebreite b (in Gefällerichtung) fehlt.':'Giebelbreite b fehlt.';return m;}
  if(roof==='flach'){
    if(!valid(eaves)||eaves<=0){m.reason='Gebäudehöhe (Trauf-/Attikahöhe) fehlt.';return m;}
    return {...m,ok:true,first:eaves,hDach:0,alpha:0,rule20:true,flatLike:true};
  }
  if(roof==='shed'){
    const top=valid(ridge)?ridge:eaves;
    if(!valid(top)||top<=0){m.reason='Firsthöhe des Sheddachs (Oberkante) fehlt.';return m;}
    return {...m,ok:true,first:top,hDach:0,alpha:0,rule20:true,flatLike:true};
  }
  const angle=roofAngle(rec);
  if(!valid(ridge,eaves)||ridge<eaves||eaves<0){m.reason='First- und Traufhöhe fehlen oder First liegt unter der Traufe.';return m;}
  if(angle.status!=='ok'||!valid(angle.used)){m.reason=angle.reason||'Dachneigung fehlt.';return m;}
  const alpha=angle.used;
  if(roof==='pult')return {...m,ok:true,first:ridge,hDach:ridge-eaves,alpha,pult:true,conflict:angle.conflict};
  return {...m,ok:true,first:ridge,hDach:ridge-eaves,alpha,rule20:alpha<20-1e-9,conflict:angle.conflict};
}
// Maximale Höhe der Rezirkulationszone über First (H2) – unabhängig von der Schornsteinposition.
function vdiH2(m){
  if(m.flatLike||m.pult)return {H2:m.b/2*TAN20,f:0,eq:m.pult?'Gl. 10':'Gl. 6 (Flachdach)'};
  if(m.rule20){const f=m.alpha/20*.85;return {H2:(1+f)*m.b/2*TAN20-m.hDach,f,eq:'Gl. 6/7'};}
  const t=vdiTable2(m.alpha);return {H2:t.f*m.hDach,f:t.f,gamma:t.gamma,eq:'Gl. 2'};
}
// Abschnitt 6.2.1: Mündungshöhe H_A1 für das Einzelgebäude mit Abgasanlage.
function vdiSingle(rec,distRidge,HU){
  const m=vdiRoofModel(rec);
  const res={status:'offen',model:m,lines:[],HA1:null};
  if(!m.ok){res.status=m.manual?'manuell':'offen';res.reason=m.reason;return res;}
  if(!valid(HU)){res.reason='Gesamtwärmeleistung fehlt (für den Zuschlag H_Ü).';return res;}
  let a=m.flatLike?0:N(distRidge);
  if(!valid(a)||a<0){res.reason=m.pult?'Horizontaler Abstand a der Mündung von der hohen Pultdachseite fehlt.':'Horizontaler Abstand a der Mündung zum First fehlt.';return res;}
  let H1,H2,gamma=0,f;
  if(m.pult){
    const c=m.alpha>=20-1e-9?0:(m.b/2-a)*(1-m.alpha/20);
    H1=(a+c)*TAN20;H2=m.b/2*TAN20;f=null;
    res.lines.push(`Pultdach (6.2.1.2.5): c = ${fmt(c)} m (Gl. 11/12); H1 = (a + c) · tan 20° = ${fmt(H1)} m (Gl. 9); H2 = b/2 · tan 20° = ${fmt(H2)} m (Gl. 10).`);
  } else if(m.rule20){
    f=m.alpha/20*.85;
    H1=(a+m.b/2)*TAN20-m.hDach;H2=(1+f)*m.b/2*TAN20-m.hDach;
    res.lines.push(`${m.flatLike?(m.roof==='shed'?'Sheddach wie Flachdach (6.2.1.2.6)':'Flachdach (6.2.1.2.3)'):'Dachneigung unter 20° (6.2.1.2.3, 20°-Regel)'}: f = ${fmt(f)} (Gl. 7); H1 = (a + b/2) · tan 20° − H_Dach = ${fmt(H1)} m (Gl. 5); H2 = (1 + f) · b/2 · tan 20° − H_Dach = ${fmt(H2)} m (Gl. 6).`);
  } else {
    const t=vdiTable2(m.alpha);gamma=t.gamma;f=t.f;
    H1=a*Math.tan(deg(m.alpha-gamma));H2=f*m.hDach;
    res.lines.push(`Neigung ${fmt(m.alpha)}°: γ = ${fmt(gamma)}°, f = ${fmt(f)} (Tab. 2, interpoliert); H1 = a · tan(α − γ) = ${fmt(H1)} m (Gl. 1); H2 = f · H_Dach = ${fmt(H2)} m (Gl. 2).`);
  }
  let HS1=Math.min(H1,H2);
  res.lines.push(`H_S1 = min(H1; H2) = ${fmt(HS1)} m (Gl. 3).`);
  if(m.roof==='walm'){
    const ratio=valid(m.b,m.len)&&m.b>0&&m.len>0?Math.max(m.b,m.len)/Math.min(m.b,m.len):null;
    res.walmRatio=ratio;
    if(ratio!==null&&ratio<=1.2+1e-9&&rec.walmEqual==='ja'){HS1*=0.6;res.lines.push(`Walmdach, Grundriss 1:${fmt(ratio)} und allseitig gleiche Neigung: H_S1 um 40 % reduziert = ${fmt(HS1)} m (6.2.1.2.7).`);}
    else res.lines.push('Walmdach als umhüllendes Satteldach gerechnet, schmale Seite als Giebel (6.2.1.2.7)'+(ratio!==null&&ratio<=1.2+1e-9&&rec.walmEqual!=='ja'?'; Abminderung nur bei bestätigter gleicher Neigung aller Dachflächen.':'.'));
  }
  let HA1=HS1+HU;
  res.lines.push(`H_A1 = H_S1 + H_Ü = ${fmt(HS1)} + ${fmt(HU)} = ${fmt(HA1)} m über ${m.flatLike?'Dach':'First'} (Gl. 4).`);
  if(m.flatLike){
    const HA1F=1.3*Math.cbrt(m.first*m.first)+HU;
    res.lines.push(`Zusätzlich Gl. 8: H_A1,F = 1,3 · ∛(H_First²) + H_Ü = ${fmt(HA1F)} m; der kleinere Wert gilt.`);
    if(HA1F<HA1){HA1=HA1F;res.eq8=true;}
  }
  if(m.rule20&&HA1>m.first){
    res.lines.push(`Gesamthöhe höchstens doppelte Gebäudehöhe (6.2.1.2.3/6.2.1.2.6): Kappung auf ${fmt(m.first)} m über ${m.flatLike?'Dach':'First'}.`);
    HA1=m.first;res.capped=true;
  }
  Object.assign(res,{status:'ok',a,H1,H2,gamma,f,HS1,HA1,first:m.first,HU});
  return res;
}
// Abschnitte 6.2.2–6.2.4: vorgelagertes Gebäude, geschlossene Bauweise, Dachaufbau, Hanglage.
function vdiUpstream(nb,ownFirst,HU){ // nb wird bei fester Stellung lokal ergänzt
  const kind=nb.kind||'einzel';
  const res={id:nb.id,name:nb.name||(kind==='aufbau'?'Dachaufbau':'Nachbargebäude'),kind,status:'offen',relevant:false,lines:[],HA:null,reason:''};
  const lA=N(nb.distance);
  if(!valid(HU)){res.reason='Gesamtwärmeleistung fehlt (für den Zuschlag H_Ü).';return res;}
  if(!valid(ownFirst)){res.reason='Firsthöhe des eigenen Gebäudes fehlt.';return res;}
  let HFv,H2v,lRZ,leff=null,base=ownFirst,delta=0;
  if(kind==='aufbau'){
    const top=N(nb.ridge),b=N(nb.gable),l=N(nb.length);
    if(!valid(top,b,l)||b<=0||l<=0){res.reason='Dachaufbau: Oberkante über eigenem Gelände, Breite und Länge eintragen.';return res;}
    HFv=top-ownFirst;
    if(!(HFv>1+1e-9&&Math.max(b,l)>2+1e-9)){res.status='nicht relevant';res.reason=`Dachaufbau überragt den First um ${fmt(HFv)} m bei größter Seite ${fmt(Math.max(b,l))} m: nur relevant bei mehr als 1 m und mehr als 2 m (6.2.3).`;return res;}
    // Wie vorgelagertes Gebäude; maßgebend ist der über den First ragende Teil, fiktives 20°-Dach über der Schmalseite (Anhang A2.1.4).
    H2v=Math.min(b,l)/2*TAN20;base=0;
    res.lines.push(`Dachaufbau ${fmt(HFv)} m über First; H2,V nach 20°-Regel über der Schmalseite = ${fmt(H2v)} m.`);
  } else {
    const m=vdiRoofModel(nb);
    if(!m.ok){res.status=m.manual?'manuell':'offen';res.reason=m.reason;return res;}
    HFv=m.first;H2v=vdiH2(m).H2;delta=N(nb.delta);
    if(!valid(delta)){res.reason='Geländedifferenz Δh fehlt.';return res;}
    res.lines.push(`${m.label}: H_First,V = ${fmt(HFv)} m, H2,V = ${fmt(H2v)} m (${vdiH2(m).eq}).`);
  }
  if(kind==='gruppe'){
    lRZ=6*HFv;res.lines.push(`Geschlossene Bauweise (6.2.2.2): l_RZ = 6,0 · H_First,V = ${fmt(lRZ)} m (höchstes Gebäude der Gruppe).`);
  } else {
    const lv=N(nb.length),bv=N(nb.gable);
    // Stellung: Giebel/Traufe gerade zum Schornstein → β = 90°; schräg → eingegebener Winkel; unbekannt → vorsichtiger Ansatz (β wird nicht verwendet).
    const o=nb.orient||'';const beta=o==='giebel'||o==='trauf'?90:o==='schraeg'?N(nb.beta):null;if(o==='giebel'||o==='trauf')nb={...nb,facing:o};
    if(!valid(lv,bv)||lv<=0||bv<=0){res.reason='Für die Rezirkulationszone Gebäudelänge und -breite eintragen.';return res;}
    if(valid(beta)&&(beta<0||beta>90)){res.reason='Winkel β muss zwischen 0° und 90° liegen.';return res;}
    if(!valid(beta)){leff=Math.hypot(lv,bv);res.lines.push(`Ohne Winkel β: größtmögliche wirksame Länge l_eff = √(l² + b²) = ${fmt(leff)} m (vorsichtiger Ansatz; mit β genauer).`);}
    else {
      const facing=nb.facing==='trauf'?lv:bv, other=nb.facing==='trauf'?bv:lv;
      leff=facing*Math.sin(deg(beta))+other*Math.cos(deg(beta));
      res.lines.push(`l_eff = l_V · sin β + b_V · cos β = ${fmt(facing)} · sin ${fmt(beta)}° + ${fmt(other)} · cos ${fmt(beta)}° = ${fmt(leff)} m (Gl. 16).`);
    }
    lRZ=1.75*leff/(1+0.25*leff/HFv);
    res.lines.push(`l_RZ = 1,75 · l_eff / (1 + 0,25 · l_eff / H_First,V) = ${fmt(lRZ)} m (Gl. 15).`);
  }
  Object.assign(res,{HFv,H2v,lRZ,leff,delta});
  if(!valid(lA)||lA<0){res.reason='Horizontaler Abstand l_A der Mündung zur zugewandten Gebäudeseite fehlt.';return res;}
  res.lA=lA;
  if(lA>=lRZ-1e-9){res.status='nicht relevant';res.reason=`Mündung außerhalb der Rezirkulationszone (l_A = ${fmt(lA)} m ≥ l_RZ = ${fmt(lRZ)} m).`;res.lines.push(res.reason);return res;}
  const p=Math.sqrt(1-(lA*lA)/(lRZ*lRZ));
  const HS2=p*(HFv+H2v)-(base);
  const HA2=HS2+HU;
  res.lines.push(`p = √(1 − l_A²/l_RZ²) = ${fmt(p)} (Gl. 18); H_S2 = p · (H_First,V + H2,V) − H_First = ${fmt(HS2)} m (Gl. 17); H_A2 = H_S2 + H_Ü = ${fmt(HA2)} m (Gl. 19).`);
  let HA=HA2;
  if(kind!=='aufbau'&&Math.abs(delta)>1e-9){
    if(delta<0&&HA2<=1e-9){HA=null;res.lines.push(`Gebäude liegt tiefer (Δh = ${fmt(delta)} m) und führt schon im ebenen Fall zu keiner Erhöhung: Hanglage entfällt (6.2.4).`);}
    else {HA=HA2+delta;res.lines.push(`Hanglage (6.2.4): H_A2,H = H_A2 + Δh = ${fmt(HA2)} + ${fmt(delta)} = ${fmt(HA)} m (Gl. 20).`);}
  }
  // Ellipsenhöhe über eigenem Gelände an der Mündungsposition (für die Grafik).
  res.ellipseTop=p*(HFv+H2v)+(kind==='aufbau'?ownFirst:delta);
  Object.assign(res,{p,HS2,HA2,HA,relevant:HA!==null&&HA>0,status:'ok'});
  if(HA===null||HA<=0)res.reason=`Rezirkulationszone liegt an der Mündungsposition unter dem eigenen First (H_A2${Math.abs(delta)>1e-9?',H':''} = ${fmt(HA===null?HA2+delta:HA)} m): keine Erhöhung.`;
  else res.reason=`Erforderlich ${fmt(HA)} m über First.`;
  return res;
}
// Abschnitt 6.3: ausreichende Verdünnung (Einwirkungsbereich, Bezugsniveau).
function vdiDilution(project,ownFirst){
  const power=N(project.general.power), t=vdiTable3(power);
  const res={status:'offen',lines:[],HE:null,reason:''};
  if(!t){res.reason='Gesamtwärmeleistung fehlt.';return res;}
  if(!valid(ownFirst)){res.reason='Firsthöhe des eigenen Gebäudes fehlt.';return res;}
  res.radius=t.radius;res.over=t.over;
  const inside=(project.openings||[]).map(o=>({d:N(o.distance),top:N(o.top),name:o.building||o.type})).filter(o=>valid(o.d)&&o.d<=t.radius+1e-9);
  if((project.openings||[]).some(o=>!valid(N(o.distance))||!valid(N(o.top)))){res.reason='Öffnungen: Abstand oder Oberkante unvollständig.';return res;}
  if(project.openingsSurvey!=='ja'){res.reason='Vollständigkeit der Öffnungserfassung ist noch nicht bestätigt.';return res;}
  if(power>=1000){res.status='manuell';res.reason='Ab 1 MW gelten zusätzliche Anforderungen (6.3.1.2, mindestens 10 m über Gelände): Einzelprüfung.';return res;}
  if(!inside.length){res.status='ok';res.HE=null;res.lines.push(`Keine Fenster, Türen oder Zuluftöffnungen im Einwirkungsbereich R = ${fmt(t.radius)} m: H_E entfällt (6.3).`);return res;}
  const top=Math.max(...inside.map(o=>o.top));
  res.HB=top;res.HE=top-ownFirst+t.over;res.status='ok';
  res.lines.push(`Einwirkungsbereich R = ${fmt(t.radius)} m, H_S = ${fmt(t.over)} m (Tab. 3). Bezugsniveau H_B = ${fmt(top)} m (höchste Oberkante im Bereich, Höhen im eigenen Geländebezug, Hanglage damit enthalten).`);
  res.lines.push(`H_E = (H_B − H_First) + H_S = (${fmt(top)} − ${fmt(ownFirst)}) + ${fmt(t.over)} = ${fmt(res.HE)} m (Gl. 22/23).`);
  return res;
}
// Gesamtberechnung H_M = max(H_A; H_E) (Abschnitt 6.1).
function vdiCalc(project){
  const b=project.building, HU=vdiHU(N(project.general.power));
  const single=vdiSingle(b,b.distRidge,HU);
  const ownModel=vdiRoofModel(b);
  const ownFirst=ownModel.ok?ownModel.first:null;
  const ups=(project.neighbors||[]).map(n=>vdiUpstream(n,ownFirst,HU));
  const dil=vdiDilution(project,ownFirst);
  const res={HU,single,ups,dil,ownFirst,status:'offen',missing:[],parts:[]};
  if(single.status!=='ok')res.missing.push('Eigenes Gebäude: '+single.reason);
  ups.forEach(u=>{if(['offen','manuell'].includes(u.status))res.missing.push(u.name+': '+u.reason);});
  if(dil.status!=='ok')res.missing.push('Verdünnung (Öffnungen): '+dil.reason);
  if(single.status==='ok')res.parts.push({label:'Einzelgebäude H_A1 (6.2.1)',value:single.HA1});
  ups.forEach(u=>{if(u.status==='ok'&&u.HA!==null)res.parts.push({label:`${u.name} (${u.kind==='aufbau'?'Dachaufbau, 6.2.3':u.kind==='gruppe'?'geschlossene Bauweise, 6.2.2.2':Math.abs(u.delta)>1e-9?'vorgelagert mit Hanglage, 6.2.2/6.2.4':'vorgelagert, 6.2.2'})`,value:u.HA});});
  if(dil.status==='ok'&&dil.HE!==null)res.parts.push({label:'Verdünnung H_E (6.3)',value:dil.HE});
  const h=N(b.chimney);
  res.actual=valid(h,ownFirst)?h-ownFirst:null;
  const manual=single.status==='manuell'||ups.some(u=>u.status==='manuell')||dil.status==='manuell';
  // H_M nur ausweisen, wenn alle Teilwerte vorliegen – ein Teilergebnis wäre zu niedrig und irreführend.
  if(res.parts.length&&!manual&&!res.missing.length)res.HM=Math.max(...res.parts.map(x=>x.value));
  if(valid(res.HM,ownFirst))res.requiredMouth=ownFirst+res.HM;
  if(manual)res.status='manuell';
  else if(res.missing.length||!valid(h))res.status='offen';
  else res.status=res.actual>=res.HM-1e-9?'ok':'nein';
  if(!valid(h))res.missing.push('Mündungshöhe des eigenen Schornsteins fehlt.');
  if(valid(res.HM,res.actual))res.raise=Math.max(0,res.HM-res.actual);
  return res;
}

// ------- gelaende.mjs -------
// Geländehöhen aus dem DGM1 des LGL Baden-Württemberg (Open Data, dl-de/by-2-0) über Adresspunkte aus OpenStreetMap (Nominatim, ODbL).
// Der WCS liefert ganzzahlige Meter; gemittelt wird über ein 5 × 5 m-Fenster um den Adresspunkt.
const GEO={nominatim:'https://nominatim.openstreetmap.org/search',wcs:'https://owsproxy.lgl-bw.de/owsproxy/wcs/WCS_INSP_BW_Hoehe_Coverage_DGM1'};
const GEO_SOURCE=()=>`Geländehöhe: DGM1 LGL-BW (Abruf ${new Date().getFullYear()}) Datenlizenz Deutschland – Namensnennung – Version 2.0, www.lgl-bw.de; Adresspunkt: © OpenStreetMap-Mitwirkende (ODbL)`;
// ETRS89 geografisch → UTM Zone 32N (EPSG:25832), GRS80.
function toUTM32(lat,lon){
  const a=6378137,f=1/298.257222101,k0=0.9996,e2=f*(2-f),ep2=e2/(1-e2),lon0=9*Math.PI/180;
  const p=lat*Math.PI/180,l=lon*Math.PI/180,sp=Math.sin(p),cp=Math.cos(p);

  const E=500000+k0*Nr*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120);
  const N=k0*(M+Nr*Math.tan(p)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));

// Minimaler GeoTIFF-Leser (unkomprimiert, ein Streifen, Ganzzahl oder Gleitkomma).
function readTiff(buf){

  if(!(b[0]===0x49||b[0]===0x4d)||u16(2)!==42)throw Error('Keine TIFF-Antwort vom Höhendienst.');

}
function dgmMean(t){const v=t.data.filter(x=>Number.isFinite(x)&&x>0&&x<5000);if(!v.length)throw Error('Keine Geländehöhe an diesem Punkt (außerhalb Baden-Württembergs?).');return v.reduce((a,b)=>a+b,0)/v.length;}
// Ergänzt bei einer Nachbaradresse ohne Ort die PLZ/den Ort der Objektadresse.
function neighborQuery(addr,objectAddr){const a=String(addr||'').trim();if(!a)return '';if(/\b\d{5}\b/.test(a))return a;const m=String(objectAddr||'').match(/\b\d{5}\b[^,]*/);return m?a+', '+m[0].trim():a;}
// Nominatim erlaubt höchstens eine Anfrage pro Sekunde: Abstand einhalten, Ergebnisse zwischenspeichern, einmal wiederholen.
let geoLast=0;const geoCache=new Map();const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function geocode(q){
  if(typeof navigator!=='undefined'&&navigator.onLine===false)throw Error('Keine Internetverbindung.');
  if(geoCache.has(q))return geoCache.get(q);
  const url=`${GEO.nominatim}?format=jsonv2&limit=1&countrycodes=de&addressdetails=1&q=${encodeURIComponent(q)}`;
  let r=null;
  for(let k=0;k<2&&!r;k++){const wait=geoLast+1200-Date.now();if(wait>0)await pause(wait);geoLast=Date.now();try{const x=await fetch(url,{headers:{'Accept-Language':'de'}});if(x.ok)r=x;else if(k)throw Error('Adresssuche nicht erreichbar ('+x.status+').');}catch(e){if(k)throw Error('Adresssuche nicht erreichbar. Bitte kurz warten und erneut versuchen.');await pause(2000);}}
  const j=await r.json();if(!j.length)throw Error('Adresse nicht gefunden: '+q);
  const x=j[0],res={lat:+x.lat,lon:+x.lon,exact:!!(x.address&&x.address.house_number),label:x.display_name};geoCache.set(q,res);return res;
}
async function dgmHeight(lat,lon){
  const [E,N]=toUTM32(lat,lon);
  if(E<350000||E>620000||N<5250000||N>5530000)throw Error('Punkt liegt außerhalb Baden-Württembergs.');
  const u=`${GEO.wcs}?service=WCS&version=2.0.1&request=GetCoverage&coverageId=EL.ElevationGridCoverage&format=image/tiff&subset=E(${(E-2.5).toFixed(1)},${(E+2.5).toFixed(1)})&subset=N(${(N-2.5).toFixed(1)},${(N+2.5).toFixed(1)})`;
  const r=await fetch(u);if(!r.ok)throw Error('Höhendienst des LGL nicht erreichbar ('+r.status+').');
  return {h:dgmMean(readTiff(await r.arrayBuffer())),E,N};
}
async function geoPoint(q){const g=await geocode(q);const d=await dgmHeight(g.lat,g.lon);return {...g,...d};}

// Aus angetippten Punkten (UTM-Meter): Schornstein S, Wandecken A und B der zugewandten Seite, optional Rückseitenpunkt C.
// β = horizontaler Winkel zwischen zugewandter Gebäudeseite und Richtung zur Abgasanlage (VDI 3781 Blatt 4, Gl. 16), bezogen auf die Wandmitte.
// d = kürzester Abstand der Mündung zur zugewandten Seite (bzw. zur nächsten Ecke), zugleich l_A.
function aerialGeometry(S,A,B,C){
  const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]],dot=(p,q)=>p[0]*q[0]+p[1]*q[1],len=p=>Math.hypot(p[0],p[1]);
  const w=sub(B,A),L=len(w);if(!(L>0.5))throw Error('Die beiden Wandecken liegen zu nah beieinander.');
  const t=Math.max(0,Math.min(1,dot(sub(S,A),w)/(L*L))),foot=[A[0]+t*w[0],A[1]+t*w[1]],d=len(sub(S,foot));
  const M=[(A[0]+B[0])/2,(A[1]+B[1])/2],v=sub(S,M);if(len(v)<0.1)throw Error('Schornstein liegt auf der Wand.');
  const beta=Math.acos(Math.min(1,Math.abs(dot(w,v))/(L*len(v))))*180/Math.PI;
  const cross=(p,q)=>p[0]*q[1]-p[1]*q[0];
  let depth=null,sameSide=false;
  if(C){depth=Math.abs(cross(w,sub(C,A)))/L;sameSide=Math.sign(cross(w,sub(C,A)))===Math.sign(cross(w,sub(S,A)));}
  return {beta,d,wall:L,depth,warnBackside:!!C&&sameSide};
}

const finite=v=>v!==null&&Number.isFinite(v);
const svgNum=v=>Number(v).toFixed(2);
function quarterCircleSVG(nb,result,ownChimney){

  const R=q.rawRadius, hasPlace=finite(d)&&d>=0&&finite(h)&&finite(delta),H=hasPlace?h-delta:null;

  for(let n=0;n<=Math.ceil(Math.max(R,EA,hasPlace?d:0)/stride);n++){
    const x=n*stride;if(x===0||X(x)<72)continue;

  }
  const points=Array.from({length:121},(_,i)=>{const a=Math.PI/2*i/120;return `${svgNum(X(R*Math.sin(a)))},${svgNum(Y(R*Math.cos(a)))}`;});

    if(hasPlace&&d<EA){const need=Math.sqrt(Math.max(0,1-d*d/(EA*EA)))*EB+(u.HA2-u.HS2);const ny=Y(need),nx=X(d);
      ell+=`<line x1="${svgNum(nx-26)}" x2="${svgNum(nx+26)}" y1="${svgNum(ny)}" y2="${svgNum(ny)}" stroke="#6b4fa0" stroke-width="3"/><rect x="${svgNum(Math.min(nx+30,cx-190))}" y="${svgNum(ny-13)}" width="180" height="22" rx="4" fill="#fff" stroke="#cfc2e6"/><text x="${svgNum(Math.min(nx+36,cx-184))}" y="${svgNum(ny+3)}" class="q-small">VDI: mind. ${fmt(need+delta)} m</text>`;}}

function vdiCard(p,c){
 const v=c.vdi,t=c.case.type;
 if(t==='keine'||t==='')return '';
 const toggle=`<div class="fieldgrid">${field('VDI-Berechnung anzeigen','general.vdiShow','Nach LAI ist die VDI-Berechnung nur bei negativem Prüfschritt 2 oder 3 erforderlich. „Immer“ zeigt sie zusätzlich informativ, z. B. um die nötige Schornsteinhöhe zu beraten.','','text',choices.vdiShow)}</div>`;
 if(!v)return `<div class="card"><div class="cardheader"><h2>VDI 3781 Blatt 4</h2>${status('nicht erforderlich')}</div><p class="smaller">${t==='neu'?'Nach den LAI-Prüfschritten ist derzeit keine Berechnung nach VDI 3781 Blatt 4 erforderlich.':'Für § 19 Abs. 2 ist keine Berechnung nach VDI 3781 Blatt 4 vorgeschrieben.'}</p>${toggle}</div>`;

 const metric=(label,val,sub,hl)=>`<div class="metric${hl?' metric-hl':''}"><strong>${safe(label)}</strong><div class="metricvalue">${val}</div>${sub?`<p>${safe(sub)}</p>`:''}</div>`;
 const big=valid(v.HM)?`<div class="summarygrid vdi-metrics">${metric('Mündung mindestens',valid(v.requiredMouth)?fmt(v.requiredMouth)+' m':'–','über eigenem Gelände',true)}${metric('Das sind über First',fmt(v.HM)+' m','H_M = max(H_A; H_E)')}${metric('Vorhanden',valid(v.actual)?fmt(N(p.building.chimney))+' m':'–',valid(v.actual)?fmt(v.actual)+' m über First':'Mündungshöhe fehlt')}${metric(v.raise>0?'Fehlt':'Reserve',valid(v.actual)?fmt(Math.abs(v.actual-v.HM))+' m':'–',v.raise>0?'Schornstein entsprechend erhöhen':'über der Mindesthöhe')}</div>`:'';
 const parts=v.parts.length?`<div class="resultlist">${v.parts.map(x=>`<div class="resultrow"><div><strong>${safe(x.label)}</strong></div><b>${fmt(x.value)} m</b></div>`).join('')}</div>`:'';
 const lines=[...(v.single.lines||[]).map(x=>'Eigenes Gebäude: '+x),...v.ups.flatMap(u=>u.lines.map(x=>u.name+': '+x)),...(v.dil.lines||[])];
 const intro=v.informative?'Informativ: Nach den LAI-Prüfschritten ist die Berechnung nicht erforderlich; das Ergebnis ändert die Prüfung nicht.':v.required?'Nach den LAI-Prüfschritten erforderlich (§ 19 Abs. 1 Satz 6). Berücksichtigt sind das eigene Gebäude, alle erfassten Nachbargebäude und Dachaufbauten mit Hanglage sowie Fenster, Türen und Lüftungsöffnungen im Einwirkungsbereich.':'Ergänzend gerechnet, weil Prüfschritt 1 positiv, der Viertelkreis aber auffällig ist (Schulung: Prüfschritt 2 empfohlen).';
 return `<div class="card vdi-card"><div class="cardheader"><h2>Berechnung nach VDI 3781 Blatt 4</h2>${status(st)}</div><p class="smaller">${safe(intro)}</p>${big}${parts}${v.missing.length?`<div class="infobox warnbox"><strong>Für die Berechnung fehlt noch:</strong><ul>${[...new Set(v.missing)].map(x=>`<li>${safe(x)}</li>`).join('')}</ul></div>`:''}${v.single.capped?'<p class="smaller">Kappung: Gesamthöhe höchstens doppelte Gebäudehöhe (6.2.1.2.3).</p>':''}<details class="more"><summary>Rechenweg anzeigen</summary>${lines.map(x=>`<p class="smaller">${safe(x)}</p>`).join('')}<p class="smaller">Genauigkeit der Eingangsdaten nach VDI 3781 Blatt 4, 5.5: Längen und Höhen 1,0 m, Winkel 5°; möglichst nach Plänen. Die Richtlinie gilt für Mündungen ohne Aufsätze, die den Abgasstrom umlenken (4.2.2).</p></details>${toggle}</div>`;
}

 `<div class="infobox warnbox">${safe(q?.reason||'Zunächst die Dachgeometrie des Nachbargebäudes aufnehmen.')}</div>`;
 const placement=q?.status==='ok' ? `<div class="q-analysis"><div class="cardheader"><h3>${v.step1==='ok'?'Ergänzende Kreisgeometrie nach positivem Schritt 1':'Prüfschritt 2 · Geometrischer Vergleich'}</h3>${status(v.step2)}</div>

function fitProtocol(sheet){
 // Messung ohne Seitenhöhe und Innenrand (beforeprint kann bereits die Druckregeln anwenden).
 sheet.style.minHeight='0px';sheet.style.display='block';
 const H=()=>{const cs=getComputedStyle(sheet);return sheet.scrollHeight-parseFloat(cs.paddingTop||0)-parseFloat(cs.paddingBottom||0);};
 let f=9;sheet.style.fontSize=f+'pt';
 for(let k=0;k<5;k++){const h=H();if(!h)break;f=Math.max(6.5,Math.min(13,f*Math.pow(PRINT_TARGET_PX/h,0.85)));sheet.style.fontSize=f.toFixed(2)+'pt';}
 while(H()>PRINT_TARGET_PX&&f>6.5){f-=0.1;sheet.style.fontSize=f.toFixed(2)+'pt';}

function applyAerial(){

function normalizeProject(p,keepIdentity=false){

 if(p.openings.length>500||p.neighbors.length>500)throw Error('Zu viele Datensätze');

 base.openings=p.openings.map(o=>fields(blankOpening(),o));base.neighbors=p.neighbors.map(n=>{const x=fields(blankNeighbor(),n);if(n.orient===undefined&&N(x.beta)!==null)x.orient='schraeg';return x;}); // Sicherungen vor V3.9: eingetragenes β = schräge Stellung

 if(keepIdentity){

  const iso=x=>typeof x==='string'&&/^\d{4}-\d\d-\d\dT[\d:.]+Z$/.test(x)&&!isNaN(Date.parse(x))?x:null;

// Sicherung mit vorhandenen Projekten abgleichen: neu → hinzufügen; gleiches Projekt → nur die neuere Fassung übernehmen.
function planImport(local,incoming){
  const byId=new Map(local.map(x=>[x.id,x])),plan={add:[],update:[],skip:[]};
  const seen=new Set();
  for(const p of incoming){
    if(seen.has(p.id))continue;seen.add(p.id);
    const old=byId.get(p.id);
    if(!old)plan.add.push(p);
    else if(Date.parse(p.updatedAt)>Date.parse(old.updatedAt||0)+1000)plan.update.push(p);
    else plan.skip.push(p);
  }
  return plan;
}

 if(plan.update.length)lines.push(...plan.update.slice(0,8).map(label),...(plan.update.length>8?['   …']:[]));
