</strong> = Mündung über First. Bei Dachneigung &lt; 20° fiktiven 20°-First verwenden.</div></div>`;}
function drawingOpenings(){return `<div class="diagram"><svg viewBox="0 0 560 260" role="img" aria-label="Lageplan: kreisförmiger Prüfumkreis R um die Schornsteinmündung und Abstand zu Fenstern"><circle cx="245" cy="118" r="96" fill="#e3f2fc" stroke="#5f9ec5" stroke-dasharray="6 5" stroke-width="2"/><rect x="173" y="80" width="140" height="77" fill="#e3e8eb" stroke="#5f7482" stroke-width="2"/><rect x="236" y="109" width="20" height="20" fill="#2c546f"/><line x1="245" y1="118" x2="339" y2="118" stroke="#227ab2" stroke-width="2" stroke-dasharray="3 4"/><text x="287" y="110" font-size="17" fill="#176aa0">R</text><rect x="324" y="69" width="150" height="93" fill="#dde5e9" stroke="#627b8a" stroke-width="2"/><rect x="323" y="91" width="13" height="31" fill="#ffbf6f" stroke="#c17c2c" stroke-width="2"/><line x1="245" y1="180" x2="329" y2="180" stroke="#b17b36" stroke-width="2"/><path d="M245 176v8 M329 176v8" stroke="#b17b36" stroke-width="2"/><text x="250" y="198" font-size="14" fill="#9a6a27">Abstand</text><text x="128" y="225" font-size="13" fill="#557285">Grundriss: Umkreis, horizontaler Abstand</text><text x="343" y="59" font-size="13" fill="#557285">Öffnung</text></svg><div class="legend">Für jede Öffnung notieren: <strong>horizontaler Abstand</strong> zur Mündung und <strong>obere Öffnungskante</strong> über demselben Höhenbezug.</div></div>`;}
function conclusionBox(calc){return `<div class="card"><div class="cardheader"><h2>Aktuelles Ergebnis der Prüfung</h2>${status(calc.overall)}</div><h3>${safe(calc.headline)}</h3><div class="resultlist"><div class="resultrow"><div><strong>Dach / Mündung</strong><small>§ 19 Abs. 1 oder 2</small></div>${status(calc.roof.status)}</div><div class="resultrow"><div><strong>Öffnungsabstände</strong><small>Leistungsabhängiger Umkreis</small></div>${status(calc.openings.status)}</div><div class="resultrow"><div><strong>LAI Nachbarbebauung</strong><small>Prüfschritte 1–3 nur für Absatz 1</small></div>${status(calc.lai.status)}</div></div><div class="infobox">AbleitCheck prüft die Ableitbedingungen nach § 19 der 1. BImSchV einschließlich der vereinfachten Prüfung nach LAI (Prüfschritte 1–3) und dokumentiert den Rechenweg. ${safe(vdiNote(calc))}</div></div>`;}
function viewStart(p,c){const ready=['general','building','openings','neighbors','environment','report'].map((a,i)=>[a, i+2]);return head('start','Prüfstand, offene Messungen und Ihre nächsten Schritte.')+`<div class="summarygrid"><div class="metric"><strong>Prüfobjekt</strong><div>${safe(p.general.address||'Noch keine Objektadresse')}</div><p>Prüfdatum: ${safe(p.general.date||'–')} · ${p.status==='abgeschlossen'?'Abgeschlossen':'Entwurf'}</p></div><div class="metric"><strong>Erfasste Elemente</strong><div style="font-size:27px;font-weight:800">${p.openings.length} <span style="font-size:13px;font-weight:450">Öffnungen</span> · ${p.neighbors.length} <span style="font-size:13px;font-weight:450">Nachbarn</span></div><p>Für iPad und Windows vorgesehen; Geräteprüfung noch ausstehend.</p></div><div class="metric"><strong>Rechnerische Einschätzung</strong>${status(c.overall)}<p>${safe(c.headline)}</p></div></div>${conclusionBox(c)}<div class="card"><h2>Arbeitsschritte</h2><div class="resultlist">${ready.map(([pg,i])=>`<div class="resultrow"><div><strong>${i}. ${safe(titles[pg][0])}</strong><small>${safe(titles[pg][1])}</small></div><button class="btn mini" data-go="${pg}">Öffnen →</button></div>`).join('')}</div></div><div class="card"><h2>Lokale Daten und Datensicherheit</h2><p class="smaller">Die Prüfobjekte werden nur in diesem Browser auf diesem Gerät gespeichert. Auf iPad und Windows existieren zunächst <strong>getrennte lokale Datenstände</strong>. Für einen Gerätewechsel eine JSON-Sicherung exportieren und auf dem anderen Gerät laden. Änderungen werden nicht automatisch abgeglichen.</p><p class="smaller"><strong>iPad:</strong> Die App über Teilen → „Zum Home-Bildschirm“ installieren und von dort starten. Safari kann gespeicherte Daten nicht installierter Webseiten nach einigen Tagen ohne Nutzung löschen. Regelmäßig „Daten sichern“ verwenden.</p><div class="actionbar"><button class="btn" data-act="duplicate">Prüfung duplizieren</button><button class="btn danger" data-act="deleteProject">Prüfobjekt löschen</button></div></div>`;}
function caseQuestions(p,c){
 const g=p.general,cs=c.case;
 if(g.caseType!=='unverh')return cs.note?`<div class="infobox">${safe(cs.label)}. ${safe(cs.note)}</div>`:'';
 const q=[['general.uvBuilt','0 · Gebäude vor dem 01.01.2022 errichtet oder Baugenehmigung vor dem 01.01.2022 erteilt?','Kenntnisgabeverfahren: Zeitpunkt, ab dem mit der Ausführung begonnen werden durfte.'],
  ['general.uv1','1 · Lassen sich § 19 Abs. 1 Sätze 1–6 mit einer nicht schwingungsanfälligen Abgasanlage einhalten?','In der Regel Schornstein mit höchstens 3 m freier Höhe über der obersten Abstützung/Halterung.'],
  ['general.uv2','2 · Ist ausreichende Verdünnung durch ausreichenden Abstand oder andere Maßnahmen gewährleistet?',''],
  ['general.uv3','3 · Lassen sich § 19 Abs. 1 Sätze 1–6 mit einer schwingungsanfälligen Abgasanlage einhalten?','In der Regel mehr als 3 m freie Höhe über der obersten Abstützung/Halterung.'],
  ['general.uv4','4 · Ist die Anlage für Raumheizung/Warmwasser erforderlich und kommt keine andere Art der Wärmeerzeugung in Betracht?','Zentrale Wärmeversorgung ohne Alternative oder Ergänzung einer unzureichenden Anlage (z. B. unterdimensionierte Wärmepumpe), wenn weder Ertüchtigung noch andere Ergänzung möglich ist.']];
 // Nur Fragen bis zur Entscheidung anzeigen.
 const ans=[g.uvBuilt,g.uv1,g.uv2,g.uv3,g.uv4];
 const stopAfter=ans[0]!=='ja'?0:ans[1]!=='nein'?1:ans[2]!=='nein'?2:ans[3]!=='nein'?3:4;
 return `<div class="sepline"></div><h3>Prüfung der Unverhältnismäßigkeit</h3><div class="fieldgrid">${q.slice(0,stopAfter+1).map(([path,label,hint])=>field(label,path,hint,'','text',choices.yn)).join('')}</div><div class="infobox ${cs.type?'':'warnbox'}"><strong>Ergebnis:</strong> ${safe(cs.label)}. ${safe(cs.note)}</div>`;
}
function viewGeneral(p,c){return head('general','Die Anwendungswahl ist eine fachliche Entscheidung. Sie steuert alle folgenden Berechnungen.')+`<div class="card"><h2>1. Prüfobjekt</h2><div class="fieldgrid">${field('Objektadresse','general.address','Straße, Hausnummer, Ort.','', 'text')}${field('Eigentümer / Ansprechpartner','general.owner','','','text')}${field('Prüfdatum','general.date','Datum der Ortsaufnahme.','','date')}${field('Prüfer','general.examiner','','','text')}${field('Feuerungsanlage / Beschreibung','general.plant','z. B. Kaminofen oder Pelletkessel.','','text')}${field('Gesamtwärmeleistung','general.power','Summe der maßgeblichen Feuerungsanlagen.','kW')}</div></div><div class="card"><h2>2. Rechtsfall auswählen</h2><div class="fieldgrid">${field('Welche Konstellation liegt vor?','general.caseType','Die Auswahl wird nicht automatisch aus dem Baujahr abgeleitet.','', 'text',choices.case)}</div>${caseQuestions(p,c)}<div class="infobox"><strong>Absatz 1 (ab 01.01.2022 errichtet):</strong> gemeinsame Errichtung von Gebäude und Feuerungsanlage; neue Feuerungsanlage in einem Bestandsgebäude; Feuerstätte an bestehendem, ungenutztem Schornstein; (weitere) Feuerstätte an bestehendem, genutztem Schornstein; neuer Schornstein für eine vor 2022 errichtete Feuerstätte.<br><strong>Absatz 2 (vor 2022 errichtet und betrieben, ab 2022 wesentlich geändert):</strong> Austausch der Feuerstätte für feste Brennstoffe; Ersatz einer Öl- oder Gasfeuerungsanlage durch feste Brennstoffe.<br><strong>Kein Fall des § 19:</strong> Wartung, Reparatur, Instandsetzung.<br><strong>Unverhältnismäßigkeit:</strong> nur bei Gebäuden, die vor 2022 errichtet oder genehmigt wurden; Prüffolge nach LIV-Arbeitshilfe 07.06.2023.<br><span class="smaller">Quelle: LIV BW, Arbeitshilfe Ableitbedingungen 07.06.2023; § 19 1. BImSchV.</span></div></div><div class="card"><h2>3. Notizen zum Anwendungsfall</h2>${field('Begründung / Nachweise','general.notes','Zum Beispiel Bau-/Inbetriebnahmejahr, TAF oder Ausnahmebegründung.','','textarea')}</div>`;}
function viewBuilding(p,c){const b=p.building;const isExisting=c.case.type==='bestand';return head('building','Hier ausschließlich reale Maße des eigenen Gebäudes erfassen; Zwischenergebnisse folgen automatisch.')+`<div class="datasplit"><div class="card"><h2>Gebäudegeometrie</h2><div class="fieldgrid">${field('Dachform','building.roof','','','text',choices.roof)}${field('Dachneigung ermitteln mit','building.pitchMode','Automatisch nur bei symmetrischem Satteldach, gleicher Traufhöhe und richtiger Giebelbreite.','','text',choices.pitchMode)}${field('Direkt gemessener Winkel (Vergleichswert)','building.pitch','Optional bei automatischer Berechnung. Bei manuellem Modus wird dieser Winkel verwendet.','°')}${field(b.roof==='flach'?'Schmalseite b (Gebäudebreite)':'Giebelbreite / Gebäudebreite','building.gable',b.roof==='flach'?'Flachdach: kurze Gebäudeseite b für den fiktiven 20°-First.':'Abstand Traufe–Traufe im Dachquerschnitt.','m')}${field('Gebäudelänge','building.length','Für Dokumentation/weitere Berechnungen.','m')}${field('Traufhöhe / Attikahöhe','building.eaves','Ab Gelände bis Traufe; bei Flachdach inklusive Attika.','m')}${field('Reale Firsthöhe','building.ridge','Bei Flachdach darf dieses Feld leer sein.','m')}${field('Mündungshöhe','building.chimney','Ab selbem Geländeniveau bis Austrittsöffnung.','m')}${field('Horizontal bis zum First (a)','building.distRidge','Von Mitte Austrittsöffnung bis First.','m')}${field('Horizontal bis zur Traufe (b)','building.distEaves','Von Mitte Austrittsöffnung bis Traufe (Tropfkante).','m')}</div><div data-angle-panel="building">${anglePanel(b)}</div>${isExisting?`<div class="sepline"></div><h3>Zusätzlich für § 19 Abs. 2</h3><div class="fieldgrid">${field('Abstand Mündung von Dachfläche','building.roofClearance','Für Dachneigung ≤20°: ≥ 1,00 m.','m')}${field('Horizontaler Abstand von Dachfläche','building.roofHorizontal','Für Dachneigung >20°: ≥ 2,30 m.','m')}</div>`:''}<div class="sepline"></div>${field('Bemerkungen zur Dachform','building.notes','Sonderformen, Attika, Dachaufbauten, Pläne und Messunsicherheiten.','','textarea')}</div><div><div class="card"><h2>Maßskizze</h2>${drawingRoof()}<div class="infobox">Alle Höhen müssen denselben Bezug haben. Bei komplizierten Dächern ist diese Skizze nur eine Orientierung – keine vollständige VDI-Berechnung.</div></div><div class="card"><div class="cardheader"><h2>Wird automatisch berechnet</h2><span class="sectiontag">Automatische Aktualisierung</span>${status(c.roof.status)}</div>${Object.entries(c.roof.values||{}).map(([key,val])=>`<div class="resultrow"><div><strong>${safe(({targetRidge:'Maßgebliche Firsthöhe',over:'Überragung des Firstes',required:'Vergleichswert (Höhe)',a:'Abstand zum First (a)',b:'Abstand zur Traufe (b)',alternative:'Gemessener Dachflächenabstand'})[key]||key)}</strong></div><b>${fmt(val)} m</b></div>`).join('')}<p class="smaller">${safe(c.roof.lines.join(' '))}</p><div class="infobox ${['nein','manuell'].includes(c.roof.status)?'warnbox':''}">${safe(c.roof.note||'Dachanforderung anhand der erfassten Maße berechnet.')}</div></div></div></div>`;}
function viewOpenings(p,c){const req=c.openings.req;return head('openings','Jede relevante Öffnung mit horizontalem Abstand und Höhe ihrer Oberkante aufnehmen.')+`<div class="datasplit"><div class="card"><div class="cardheader"><h2>Erforderliche Werte</h2>${status(c.openings.status)}</div>${req.status==='ok'?`<div class="summarygrid" style="grid-template-columns:1fr 1fr"><div class="metric"><strong>Prüfumkreis</strong><div style="font-size:24px;font-weight:780">${fmt(req.radius)} m</div></div><div class="metric"><strong>Überragung der Öffnung</strong><div style="font-size:24px;font-weight:780">${fmt(req.over)} m</div></div></div>`:`<div class="infobox warnbox">${safe(req.reason)}</div>`}<div class="infobox">Automatisch: <strong>Radius</strong> aus Gesamtwärmeleistung und gewähltem Absatz; <strong>Ist-Überragung</strong> = Mündungshöhe − Oberkante Öffnung. Beides auf demselben Geländehöhenbezug aufnehmen.</div></div><div class="card">${drawingOpenings()}</div></div><div class="card"><div class="cardheader"><h2>Liste aller geprüften Öffnungen</h2><div class="rowactions"><span class="sectiontag">Automatische Aktualisierung</span><button class="btn primary mini" data-act="addOpening">＋ Öffnung</button></div></div>${!p.openings.length?`<div class="empty">Noch keine Öffnung erfasst. Falls tatsächlich keine maßgebliche Öffnung vorhanden ist, unten die Vollständigkeit bestätigen.</div>`:p.openings.map((o,i)=>`<div class="card" style="box-shadow:none;background:#fafcfe;padding:15px"><div class="neighborhead"><h3>Öffnung ${i+1}</h3><div class="rowactions">${status(c.openings.list[i].status)}<button class="btn danger mini" data-act="removeOpening" data-id="${safe(o.id)}">Entfernen</button></div></div><div class="fieldgrid triple">${field('Öffnungsart',`openings.${i}.type`,'','','text',[['Fenster','Fenster'],['Tür','Tür'],['Lüftung','Lüftungsöffnung']])}${field('Gebäude / Lage',`openings.${i}.building`,'z. B. Nachbar rechts, DG','','text')}${field('Horizontaler Abstand zur Mündung',`openings.${i}.distance`,'Maßgeblicher Umkreis in der Horizontalen.','m')}${field('Oberkante Öffnung (gleiches Niveau)',`openings.${i}.top`,'Höhe ab Gelände-Bezug des Betreibergebäudes.','m')}</div><div class="mathresult">${safe(c.openings.list[i].info)}</div></div>`).join('')}<div class="sepline"></div><div class="fieldgrid">${field('Sind die Öffnungen vollständig geprüft?','openingsSurvey','Ja nur wählen, wenn auch eigene Gebäudeseiten und angrenzende Häuser berücksichtigt wurden.','','text',choices.yn)}</div><div class="infobox ${c.openings.status==='nein'?'dangerbox':''}">${safe(c.openings.note)}</div></div>`;}
function quarterPanel(n,v,ownChimney){
 const q=v.roofInfo;
 const angle=roofAngle(n);
 const f=q?.status==='ok' ? `<div class="q-rechenschritte">
   <div class="q-metric"><small>1 · Dachneigung / Faktor</small><b>${safe(q.roofLabel)}</b><span>${safe(angle.mode==='auto'?'Winkel aus Maßen berechnet':'Direkt gemessener Winkel')} · Faktor: <strong>${fmt(q.factor)}</strong></span></div>
   <div class="q-metric"><small>2 · Bezugshöhe</small><b>${fmt(q.baseHeight)} m</b><span>${q.fictive!==null?'Traufhöhe · fiktiver 20°-First':'Firsthöhe des Nachbargebäudes'}</span></div>
   <div class="q-metric"><small>3 · Zuschlag</small><b>+ ${fmt(q.surcharge)} m</b><span>${fmt(q.factor)} × ${fmt(q.rise)} m ${q.fictive!==null?'(20°-Dachhöhe)':'(First − Traufe)'}</span></div>
   <div class="q-metric q-metric-highlight"><small>4 · Viertelkreisradius</small><b>R = ${fmt(q.radius)} m</b><span>${fmt(q.baseHeight)} + ${fmt(q.surcharge)} m</span></div>
 </div><div class="q-formula">Formel laut Dachtyp: <strong>${safe(q.formula)}</strong>${q.fictive!==null?` · fiktive Dachhöhe = halbe ${n.roof==='flach'?'Gebäudebreite (Schmalseite)':'Giebelbreite'} × tan(20°) = ${fmt(q.fictive)} m`:''}</div>`:
 `<div class="infobox warnbox">${safe(q?.reason||'Zunächst die Dachgeometrie des Nachbargebäudes aufnehmen.')}</div>`;
 const placement=q?.status==='ok' ? `<div class="q-analysis"><div class="cardheader"><h3>${v.step1==='ok'?'Ergänzende Kreisgeometrie nach positivem Schritt 1':'Prüfschritt 2 · Geometrischer Vergleich'}</h3>${status(v.step2)}</div>
    <div class="q-data-row"><span>Horizontaler Abstand d (keine Schrägstrecke)</span><strong>${num(n.distance)}</strong></div>
    <div class="q-data-row"><span>Geländedifferenz Δh (Nachbar − emittierendes Gebäude)</span><strong>${num(n.delta)}</strong></div>
    <div class="q-data-row"><span>Geländelage aus Δh</span><strong>${N(n.delta)===null?'Geländelage noch offen':N(n.delta)>0?'Nachbar hangaufwärts / höher':N(n.delta)<0?'Nachbar hangabwärts / tiefer':'Gleiche Geländehöhe'}</strong></div><div class="q-data-row"><span>Mündung über Nachbargelände (Mündungshöhe − Δh)</span><strong>${v.mouthHeightNeighbor===undefined?'Noch offen':fmt(v.mouthHeightNeighbor)+' m'}</strong></div>
    <div class="q-data-row"><span>Abstand Mündung zum Kreismittelpunkt √(d² + H²)</span><strong>${v.separation===undefined?'Noch offen':fmt(v.separation)+' m'}</strong></div>
    <div class="q-data-row"><span>Kreisbogen auf Mündungsposition (über eigenem Gelände)</span><strong>${v.arcHeight===null||v.arcHeight===undefined?(v.horizontalOutside?'Bei d ≥ R kein Kreisbogen über der Position':'Noch offen'):fmt(v.arcHeight)+' m'}</strong></div>
    <div class="q-data-row q-balance"><span>Abstand zum Viertelkreis (radial; + = außerhalb)</span><strong>${v.gap===undefined?'Noch offen':(v.gap>0?'+ ':'')+fmt(v.gap)+' m'}</strong></div>
    ${v.step2==='nein' && v.requiredRaise!==undefined?`<div class="infobox dangerbox"><strong>Geometrische Differenz zur Kreisgrenze: ${fmt(v.requiredRaise)} m.</strong> Nur ein anschaulicher Höhenvergleich, keine automatisch festgelegte Schornsteinerhöhung oder VDI-Berechnung.</div>`:''}
    <p class="smaller">${safe(v.reason)}</p>
   </div>`:'';
 return `<div class="mathresult q-panel">${angle.conflict?`<div class="infobox warnbox"><strong>Winkelwiderspruch:</strong> ${safe(angle.reason)}</div>`:''}<div class="cardheader"><h3>Automatische Firsthöhen- und Viertelkreisprüfung</h3>${status(v.status)}</div>
 <div class="resultrow"><div><strong>Schritt 1 – Mündung über Nachbarfirst?</strong><small>Bei unterschiedlichen Gelände-Niveaus zuerst Δh berücksichtigen.</small></div><div>${status(v.step1)} · ${v.heightGap===undefined?'–':fmt(v.heightGap)+' m'}</div></div>
 ${f}${quarterCircleSVG(n,v,ownChimney)}${placement}
 <div class="q-table-note">Faktoren der Schulungstabelle: Flachdach 1,00 × fiktive 20°-Dachhöhe · 0–&lt;20° 1,85 × fiktive 20°-Dachhöhe · 20–&lt;30° 0,85 · 30–&lt;45° 0,70 · 45–&lt;60° 0,50 · ab 60° 0,45 × (First − Traufe). Die Grafik ist ein vereinfachter geometrischer Schnitt, kein VDI-Vollnachweis. Es gibt hier keinen pauschalen gesetzlichen 50-cm-Grenzbereich. Messqualität und Unsicherheit müssen vor einer positiven Bewertung fachlich bestätigt werden.</div></div>`;
}
function refreshAnglePanels(){
  const p=state.project;
  document.querySelectorAll('[data-angle-panel]').forEach(el=>{
    const target=el.getAttribute('data-angle-panel');
    const obj=target==='building'?p.building:getPath(p,target);
    if(obj)el.innerHTML=anglePanel(obj);
  });
}
function refreshQuarterPanels(){
 if(state.page!=='neighbors')return;
 const c=evaluate(state.project);
 state.project.neighbors.forEach((n,i)=>{
  const slot=document.querySelector(`[data-quarter-panel="${i}"]`);
  if(slot){slot.innerHTML=quarterPanel(n,c.neighbors[i],state.project.building.chimney);const title=slot.closest('.card')?.querySelector('.neighborhead h2');if(title)title.textContent=`Nachbargebäude ${i+1}: ${n.name||'unbenannt'}`;}
 });
}
function viewNeighbors(p,c){const cards=p.neighbors.map((n,i)=>{const v=c.neighbors[i];return `<div class="card"><div class="neighborhead"><h2>Nachbargebäude ${i+1}: ${safe(n.name||'unbenannt')}</h2><button class="btn danger mini" data-act="removeNeighbor" data-id="${safe(n.id)}">Entfernen</button></div><div class="fieldgrid triple">${field('Bezeichnung / Lage',`neighbors.${i}.name`,'z. B. Haus links, Flurstück 123','','text')}${field('Lage zum emittierenden Gebäude',`neighbors.${i}.positionNotes`,'z. B. hangaufwärts, hangabwärts, seitlich, Himmelsrichtung; reine Beschreibung, kein Ausschluss.','','text')}${field('Dachform',`neighbors.${i}.roof`,'Für Sonderdächer ist eine Einzelprüfung erforderlich.','','text',choices.roof)}${field('Dachneigung ermitteln mit',`neighbors.${i}.pitchMode`,'Für symmetrische Satteldächer automatisch; ansonsten direkt messen.','','text',choices.pitchMode)}${field('Direkt gemessene Dachneigung (Vergleichswert)',`neighbors.${i}.pitch`,'Optional bei Automatik; bei direkter Messung für Zuschlagsfaktor verwendet.','°')}${field(n.roof==='flach'?'Gebäudebreite (Schmalseite b)':'Giebelbreite',`neighbors.${i}.gable`,'Für fiktives 20°-Dach: beim Flachdach die kurze Gebäudeseite b eingeben.','m')}${field('Gebäudelänge',`neighbors.${i}.length`,'Relevant auch für Umgebungsbetrachtung.','m')}${field('Traufhöhe Nachbar',`neighbors.${i}.eaves`,'Ab Nachbargelände bis Traufe.','m')}${field('Firsthöhe Nachbar',`neighbors.${i}.ridge`,'Ab Nachbargelände bis First.','m')}${field('Horizontaler Abstand d',`neighbors.${i}.distance`,'Mündung zur nächstgelegenen Gebäudekante.','m')}${field('Geländedifferenz Δh',`neighbors.${i}.delta`,'Nachbargelände minus eigenes Gelände, jeweils am Fußpunkt des Lots unter dem First (symmetrisches Dach: Mitte Giebelseite). Höher = positiv; ebenerdig 0,00.','m')}</div><div data-angle-panel="neighbors.${i}">${anglePanel(n)}</div>${field('Besonderheiten',`neighbors.${i}.notes`,'z. B. Gebäudehöhe ungesichert, komplexer Dachaufbau, Gelände.','','textarea')}<div data-quarter-panel="${i}">${quarterPanel(n,v,p.building.chimney)}</div></div>`;}).join('');return head('neighbors','Nachbargebäude unabhängig von vorne/hinten aufnehmen. Alle erfassten Gebäude werden mit Geländeumrechnung ausgewertet.')+`<div class="infobox warnbox"><strong>Gebäudelage ist kein Ausschluss:</strong> „Vorgelagert“ im LAI-Verfahren ist keine Auswahl nach vorne/hinten, bergauf/bergab oder einer festen Windrichtung. Alle hier erfassten Nachbargebäude werden geprüft. Die Hanglage ist bei Schritt 1 und 2 einzurechnen und bei Schritt 3 zu würdigen. Das bedeutet keine pauschale Viertelkreispflicht bei jeder Hanglage. Kreis und Radius gehören zum untersuchten Nachbargebäude; eine umgekehrte Konstruktion um das emittierende Gebäude ist kein Ersatz für diese Prüfung.</div><div class="datasplit"><div class="card"><h2>Welche Werte brauche ich?</h2><div class="resultlist">${['Firsthöhe, Traufhöhe','Dachneigung und Giebelbreite (Flachdach: Schmalseite b)','Gebäudelänge / Gebäudeform','Horizontaler Abstand zur nächsten Gebäudekante','Geländehöhenunterschied Δh (auch 0,00 m explizit)','Lage, Geländehöhen und möglicher Einfluss – kein Ausschluss nach vorne/hinten'].map(t=>`<div class="resultrow"><div><strong>${t}</strong></div><span class="sectiontag">Aufmaß</span></div>`).join('')}</div><div class="infobox">Ablauf nach Schulungsfolie 15: Prüfschritt 1 positiv → Prüfschritt 3. Andernfalls Prüfschritt 2 → bei positiver Außenlage Prüfschritt 3. Ergänzende Kreiswerte bei positivem Schritt 1 ändern diesen Ablauf nicht.</div></div><div class="card"><h2>Messgrundlage</h2><p class="smaller">Der <strong>Viertelkreis</strong> wird für jedes Nachbargebäude unten automatisch <strong>mit den eingegebenen Werten maßstäblich</strong> gezeichnet. Eine leere Standardskizze ist dafür nicht ausreichend.</p><p class="smaller">Δh = Nachbargelände minus eigenes Gelände. Mündungshöhe am eigenen Gebäude unter „Gebäude & Dach“ eintragen. Die Kreisgrafik aktualisiert sich beim Tippen.</p></div></div><div class="actionbar" style="margin-bottom:18px"><button class="btn primary" data-act="addNeighbor">＋ Nachbargebäude erfassen</button><span class="sectiontag">Automatische Aktualisierung</span><span class="smaller">Beliebig viele Nachbargebäude möglich.</span></div>${cards||`<div class="empty">Noch keine Nachbargebäude angelegt. Erfassen Sie möglicherweise einflussreiche Nachbargebäude unabhängig von vorne/hinten oder bergauf/bergab. Die vollständige Umgebungserfassung ist separat zu bestätigen.</div>`}`;}
function viewEnvironment(p,c){return head('environment','50-m-Umfeld vollständig beurteilen. Diesen Schritt kann keine einzelne Rechenformel ersetzen.')+`<div class="card"><h2>LAI-Prüfschritt 3 – Umgebungsbetrachtung</h2><div class="fieldgrid">${field('Umgebung im 50-m-Umkreis vollständig betrachtet?','environment.survey','Gebäude, Straßen- oder Blockrandbebauung, Hallen.','','text',choices.yn)}${field('Deutlich größere Nachbargebäude mit möglichem Einfluss im 50-m-Umkreis?','environment.larger','LAI-Prüfschritt 3: Einfluss fachlich beurteilen; vorne/hinten und bergauf/bergab allein erlauben keinen Ausschluss. Höhe, Breite und Länge betrachten.','','text',choices.yn)}${field('Komplexe Dach-, Gebäude- oder Geländeformen?','environment.complex','Bei Ja Einzelfallprüfung; keine automatische Positivwertung.','','text',choices.yn)}${field('Hanglage geprüft / Geländehöhen berücksichtigt?','environment.slope','Ja: Höhen der aufgenommenen Nachbargebäude im gleichen Bezug verglichen.','','text',[['unk','Noch nicht geprüft'],['ja','Ja, berücksichtigt'],['nein','Nein, Nachprüfung nötig']])}</div><div class="sepline"></div>${field('Messqualität und Grenznähe fachlich geprüft?','environment.accuracy','Messverfahren und Unsicherheiten dokumentieren. Bei unklarer Außenlage kein positiver Nachweis.','','text',choices.yn)}${field('Notizen zur Umgebung','environment.notes','Lage/Breite/Länge/Höhe auffälliger Gebäude, Fotos, Messmethode, ggf. Behördenrücksprache.','','textarea')}<div class="infobox warnbox">Bewertung „deutlich größer“ erfolgt fachlich anhand <strong>Höhe, Breite und Länge</strong>. Ein pauschaler Schwellwert steht in den LAI-Unterlagen nicht. Bei deutlich größeren Gebäuden mit relevantem Einfluss gemäß LAI-Prüfschritt 3 VDI-Nachweis veranlassen; komplexe Verhältnisse fachlich im Einzelfall prüfen.</div></div><div class="card"><div class="cardheader"><h2>Ergebnis der LAI-Prüfung</h2>${status(c.lai.status)}</div>${c.lai.notes.map(x=>`<p>${safe(x)}</p>`).join('')}<div class="resultlist">${c.neighbors.map(x=>`<div class="resultrow"><div><strong>${safe(x.name)}</strong><small>${safe(x.reason)}</small></div>${status(x.status)}</div>`).join('')||'<p class="smaller">Keine Nachbargebäude erfasst.</p>'}</div></div><div class="card"><h2>Fotos und Aufmaßnachweise</h2><div class="photos">${(p.photos||[]).map(x=>`<div class="photo"><img src="${safe(x.dataUrl)}" alt="Objektfoto"><small>${safe(x.name)}</small><button data-act="removePhoto" data-id="${safe(x.id)}" title="Foto entfernen">✕</button></div>`).join('')}</div><label class="btn">＋ Foto hinzufügen <input type="file" id="photoUpload" accept="image/*" capture="environment" hidden multiple></label><p class="footnotes">Fotos werden vor der lokalen Speicherung verkleinert. Aus Datenschutz- und Sicherungsgründen regelmäßig eine JSON-Sicherung erstellen.</p></div>`;}
function detailedReportHTML(p,c){const row=(a,b)=>`<tr><th style="width:34%">${safe(a)}</th><td>${safe(b)}</td></tr>`;const o=p.openings||[],n=p.neighbors||[];return `<div class="reportSheet"><p class="rmeta">ABLEITCHECK · VORPRÜFBERICHT · ${safe(RULE_DATE)} · Entwurf eines technischen Prüfnachweises</p><h1>Prüfung der Ableitbedingungen</h1>${p.migrationNotice?`<p class="rnote">${safe(p.migrationNotice)}${p.migrationAck?' (Vom Prüfer als geprüft quittiert.)':''}</p>`:''}<p class="rmeta">Dokument erzeugt: ${new Date().toLocaleString('de-DE')} · Status: ${p.status==='abgeschlossen'?'vom Anwender abgeschlossen':'Entwurf'}</p><table>${row('Objekt',p.general.address||'–')}${row('Eigentümer',p.general.owner||'–')}${row('Prüfdatum',p.general.date||'–')}${row('Prüfer',p.general.examiner||'–')}${row('Feuerungsanlage',p.general.plant||'–')}${row('Gesamtwärmeleistung',p.general.power?`${p.general.power} kW`:'–')}${row('Anwendungsfall',c.case.label+(c.case.note?' – '+c.case.note:''))}</table><h2>1. Gebäude und Dach</h2><table>${row('Dachform',p.building.roof)}${row('Dachneigung für Prüfung',roofAngle(p.building).used===null?'–':fmt(roofAngle(p.building).used)+'° ('+(roofAngle(p.building).mode==='auto'?'aus Gebäudegeometrie berechnet':'direkt gemessen')+')')}${row('Gemessener Vergleichswinkel',p.building.pitch?p.building.pitch+'°':'nicht eingetragen')}${row('Winkelplausibilität',roofAngle(p.building).conflict?roofAngle(p.building).reason:'Keine Abweichung über 5° / Faktorgrenze festgestellt oder kein Vergleichswert vorhanden')}${row('Giebelbreite / Gebäudelänge',`${num(p.building.gable)} / ${num(p.building.length)}`)}${row('Traufhöhe / Firsthöhe',`${num(p.building.eaves)} / ${num(p.building.ridge)}`)}${row('Mündungshöhe',num(p.building.chimney))}${row('Abstand zum First / zur Traufe',`${num(p.building.distRidge)} / ${num(p.building.distEaves)}`)}${row('Dachanforderung',c.roof.status+' – '+(c.roof.note||c.roof.lines.join(' ')))}</table><h2>2. Öffnungen und Umkreisregel</h2><p>${safe(c.openings.req.radius?`Prüfumkreis ${fmt(c.openings.req.radius)} m; Überragung ≥ ${fmt(c.openings.req.over)} m`:(c.openings.req.reason||'Noch offen'))}</p><table><thead><tr><th>Öffnung / Gebäude</th><th>Abstand</th><th>Oberkante</th><th>Ergebnis</th></tr></thead><tbody>${o.map((x,i)=>`<tr><td>${safe(x.type)} · ${safe(x.building)}</td><td>${num(x.distance)}</td><td>${num(x.top)}</td><td>${safe(c.openings.list[i]?.status)}: ${safe(c.openings.list[i]?.info)}</td></tr>`).join('')||'<tr><td colspan="4">Keine Öffnungen erfasst</td></tr>'}</tbody></table><p>Erfassung vollständig: ${safe(p.openingsSurvey)}</p><h2>3. Nachbargebäude mit möglichem Einfluss / LAI-Prüfung 1–2</h2><table><thead><tr><th>Gebäude / Lage</th><th>Geometrie / Δh</th><th>Abstand</th><th>Prüfung</th></tr></thead><tbody>${n.map((x,i)=>`<tr><td>${safe(x.name)}<br>${safe(x.roof)}; Lage: ${safe(x.positionNotes||'nicht beschrieben')}<br>${safe(x.notes||'')}</td><td>First ${num(x.ridge)}; Traufe ${num(x.eaves)}<br>Giebel ${num(x.gable)}; Neigung verwendet ${fmt(roofAngle(x).used)}° (${roofAngle(x).mode==='auto'?'berechnet':'gemessen'}), Vergleich: ${safe(x.pitch||'–')}°; Δh ${num(x.delta)}</td><td>${num(x.distance)}</td><td>Schritt 1: ${safe(c.neighbors[i]?.step1)}<br>Schritt 2: ${safe(c.neighbors[i]?.step2)}<br>R: ${c.neighbors[i]?.radius===null?'–':fmt(c.neighbors[i]?.radius)+' m'}<br>${safe(c.neighbors[i]?.reason||'')}</td></tr>`).join('')||'<tr><td colspan="4">Keine Nachbargebäude erfasst</td></tr>'}</tbody></table>${n.length?`<h2>3a. Grafische Viertelkreisprüfung je Nachbargebäude</h2>${n.map((nb,i)=>{const v=c.neighbors[i];return `<section class="rquarter"><h3>${safe(nb.name||'Nachbargebäude '+(i+1))} – Viertelkreis</h3><p>Prüfschritt 1: ${safe(v.step1)} · Prüfschritt 2: ${safe(v.step2)} · Radius: ${v.radius===null?'offen':fmt(v.radius)+' m'}. Winkel: ${fmt(roofAngle(nb).used)}° (${roofAngle(nb).mode==='auto'?'aus Dachgeometrie':'gemessen'}). ${safe(v.reason)}</p>${v.roofInfo?.status==='ok'?`<p>Faktor: ${fmt(v.roofInfo.factor)} · Dachhöhe: ${fmt(v.roofInfo.rise)} m · Zuschlag: ${fmt(v.roofInfo.surcharge)} m · <strong>R: ${fmt(v.radius)} m</strong> · Mündung-Abstand: ${v.separation===undefined?'offen':fmt(v.separation)+' m'} · Kreisbogenhöhe: ${v.arcHeight===null||v.arcHeight===undefined?(v.horizontalOutside?'außerhalb d ≥ R':'offen'):fmt(v.arcHeight)+' m über eigenem Gelände'}.</p>`:''}${quarterCircleSVG(nb,v,p.building.chimney)}</section>`;}).join('')}`:''}<h2>4. Umgebungsbetrachtung / LAI-Prüfung 3</h2><table>${row('50 m vollständig betrachtet',p.environment.survey)}${row('Deutlich größere Gebäude',p.environment.larger)}${row('Komplexe Verhältnisse',p.environment.complex)}${row('Hanglage berücksichtigt',p.environment.slope)}${row('Messqualität geprüft',p.environment.accuracy)}${row('LAI-Prüfergebnis',c.lai.status)}${row('Umgebungsbemerkung',p.environment.notes)}</table><h2>5. Ergebnis und Beurteilung</h2><p class="rstatus">${safe(c.headline)} (${safe(c.overall)})</p><div class="rnote"><strong>Hinweis:</strong> ${safe(vdiNote(c))}</div><p><strong>Notizen / weiterführende Maßnahmen:</strong> ${safe(p.finalNotes||'–')}</p><p><strong>Rechtsfall-Bemerkungen:</strong> ${safe(p.general.notes||'–')}</p><p><strong>Dach-Bemerkungen:</strong> ${safe(p.building.notes||'–')}</p>${(p.photos||[]).length?`<h2>Fotodokumentation</h2><div class="rphotos">${p.photos.map(ph=>`<img src="${safe(ph.dataUrl)}" alt="${safe(ph.name)}">`).join('')}</div>`:''}<div class="rfoot">Quellen: § 19 1. BImSchV – ${safe(SOURCES.law)}<br>LAI, Auslegungsfragen zur 1. BImSchV, Stand 13.03.2026, Kapitel I Anlage 2 – ${safe(SOURCES.lai)}<br>Schulungsunterlagen Ableitbedingungen, Landesinnungsverband / STS Baden-Württemberg · Dokument nur für die erfassten Gegebenheiten.</div></div>`;}
function viewReport(p,c){return head('report','Bericht enthält Messdaten, Rechenwerte und offene Punkte. PDF-Erstellung über Drucken → Als PDF sichern.')+conclusionBox(c)+`<div class="card"><h2>Abschlussvermerk</h2>${field('Fachliche Anmerkungen / weitere Maßnahmen','finalNotes','Beschreiben, was noch zu veranlassen oder gesondert nachzuweisen ist.','','textarea')}<div class="sepline"></div><div class="actionbar"><button class="btn primary" data-act="print">Abschlussbericht · PDF / Drucken</button><button class="btn" data-act="detail">Ausführlichen Bericht drucken</button><p class="smaller">Windows: Druckziel „Als PDF speichern“. iPad: Druckvorschau öffnen, vergrößern und über Teilen in „Dateien“ sichern. A4, 100 %, Kopf-/Fußzeilen aus. Offline verfügbar. Bei Überlänge wird der Einseiten-Export angehalten.</p>${p.status==='abgeschlossen'?`<button class="btn" data-act="reopen">Zur Bearbeitung öffnen</button>`:`<button class="btn" data-act="close">Als bearbeitet abschließen</button>`}<button class="btn" data-act="downloadProject">Prüfobjekt als JSON exportieren</button></div><div class="infobox warnbox">„Abgeschlossen“ ist ein interner Bearbeitungsstatus und keine Aussage „baurechtlich abgenommen“ oder „zulässig“. Bei noch offenen Punkten erfolgt die Dokumentation ausdrücklich mit Vorbehalt.</div></div><div class="card reportPreview"><div class="cardheader"><h2>Vorschau des Prüfberichts</h2><span class="sectiontag">Drucktauglich A4</span></div>${reportHTML(p,c)}</div>`;}

// V3.3: read-only documentation layer. Calculation and storage remain V3.2.
function reportHTML(p,c){
 const g=p.general,e=p.environment;
 const notApplicable=c.overall==='nicht erforderlich';
 const missing=[['Objektadresse',g.address],['Prüfdatum',g.date],['Anlagenart',g.plant],['Leistung',notApplicable?'-':g.power],['Anwendungsfall',g.caseType]].filter(([,v])=>!v||v==='unk').map(([k])=>k);
 const unresolved=missing.length>0||c.overall==='offen';
 const headline=unresolved?'Prüfung nicht abschließbar':notApplicable?'Keine Anpassung nach § 19 erforderlich':c.overall==='ok'?'Prüfung ohne erkennbare Auffälligkeit':'Weitere Prüfung erforderlich';
 const explanation=unresolved?'Die vorliegenden Angaben reichen für eine abschließende Prüfung noch nicht aus. Eine positive Gesamtbeurteilung kann derzeit nicht abgegeben werden.':notApplicable?'Nach den erfassten Angaben handelt es sich um Wartung, Reparatur oder Instandsetzung und nicht um eine Errichtung, wesentliche Änderung oder einen Austausch. Die Ableitbedingungen nach § 19 sind deshalb nicht neu zu prüfen.':c.overall==='ok'?'In den geprüften Punkten ergeben sich anhand der erfassten Angaben keine erkennbaren Auffälligkeiten. Die Aussage gilt für den dokumentierten Prüfungsumfang.':'Die Prüfung zeigt Punkte, die fachlich geklärt oder weitergehend nachgewiesen werden müssen.';
 const summary=v=>v==='ok'?'Ohne erkennbare Auffälligkeit':v==='nicht erforderlich'?'Für den gewählten Anwendungsfall nicht anzuwenden':v==='offen'?'Noch nicht abschließend beurteilbar':v==='vdi'?'Weitergehender VDI-Nachweis erforderlich':'Weitere fachliche Prüfung erforderlich';
 const roofText=c.roof.status==='ok'?'Die erfasste Höhe und Lage der Schornsteinmündung erfüllen im vereinfachten Rechenvergleich die für diesen Fall geprüften Anforderungen an die Ableitung über dem eigenen Dach.':c.roof.status==='nein'?'Die erfasste Höhe oder Lage der Schornsteinmündung reicht nach dem Rechenvergleich für die geprüften Dachanforderungen nicht aus. Die Ausführung muss fachlich überprüft werden.':c.roof.status==='offen'?'Ob der Schornstein ausreichend hoch und passend zum Dach angeordnet ist, lässt sich mit den vorhandenen Angaben noch nicht beurteilen.':'Die Dachform oder die erfassten Verhältnisse erfordern eine gesonderte fachliche Beurteilung der Schornsteinhöhe und -lage.';
 const openingText=c.openings.status==='ok'?((p.openings||[]).length?'Die aufgenommenen Fenster, Türen und Lüftungsöffnungen werden nach dem Rechenvergleich ausreichend von der Schornsteinmündung überragt oder liegen außerhalb des maßgeblichen Prüfumkreises.':'Laut bestätigter Umgebungserfassung sind keine zu berücksichtigenden Fenster, Türen oder Lüftungsöffnungen im maßgeblichen Prüfumkreis vorhanden.') :c.openings.status==='nein'?'Mindestens eine erfasste Öffnung liegt im maßgeblichen Prüfumkreis und wird von der Schornsteinmündung nicht ausreichend überragt. Dieser Punkt ist vor einer abschließenden Beurteilung zu klären.':c.openings.status==='offen'?'Ob Fenster, Türen und Lüftungsöffnungen im Umfeld ausreichend vor Abgaseinwirkungen berücksichtigt sind, ist noch nicht abschließend prüfbar. Angaben oder die Bestätigung der vollständigen Erfassung fehlen.':'Die Anforderungen zum Schutz der Öffnungen können für den gewählten Fall nicht allein mit dieser vereinfachten Prüfung beurteilt werden.';
 const laiText=c.lai.status==='ok'?'Die aufgenommenen Nachbargebäude und die bestätigte Umgebungsbetrachtung ergeben in den vereinfachten LAI-Prüfschritten keinen Hinweis darauf, dass wegen dieser Einflüsse ein weitergehender Nachweis zur Abgasableitung erforderlich wird.':c.lai.status==='nicht erforderlich'?'Für den gewählten Bestandsfall ist das vereinfachte LAI-Verfahren der App nicht vorgesehen. Daraus folgt keine Aussage, dass Nachbargebäude oder die Umgebung ohne Bedeutung sind.':c.lai.status==='vdi'?'Die erfassten Nachbargebäude oder die Umgebungsbewertung zeigen mögliche Einflüsse auf die Abgasableitung. Die vereinfachte Prüfung reicht deshalb nicht aus; ein weitergehender Nachweis nach VDI 3781 Blatt 4 ist erforderlich.':c.lai.status==='offen'?'Der Einfluss von Nachbargebäuden und Gelände auf die Abgasableitung ist noch nicht abschließend geklärt. Dafür fehlen Angaben oder eine vollständige fachliche Bewertung der Umgebung.':'Besondere Gebäude-, Dach- oder Geländeverhältnisse erfordern eine fachliche Einzelprüfung; gegebenenfalls ist ein Nachweis nach VDI 3781 Blatt 4 notwendig.';
 const issues=[];
 if(missing.length)issues.push('Fehlende Angaben: '+missing.join(', ')+'.');
 if(!notApplicable&&c.roof.status!=='ok')issues.push('Dach und Schornstein: '+(c.roof.note||c.roof.lines?.join(' ')||summary(c.roof.status)));
 if(!notApplicable&&c.openings.status!=='ok')issues.push('Öffnungen im Umfeld: '+summary(c.openings.status)+'.'+(p.openingsSurvey!=='ja'?' Die vollständige Erfassung ist noch nicht bestätigt.':''));
 if(!['ok','nicht erforderlich'].includes(c.lai.status))issues.push(...c.lai.notes);
 // Only unresolved neighbors affect the summary; full geometry stays in detailed report.
 if(!notApplicable)for(let i=0;i<c.neighbors.length;i++){const v=c.neighbors[i];if(!['ok','nicht relevant','nicht erforderlich'].includes(v.status))issues.push((p.neighbors[i].name||'Nachbargebäude '+(i+1))+': '+v.reason);}
 if(p.migrationNotice&&!p.migrationAck)issues.push(p.migrationNotice);
 const notes=[g.notes,p.building.notes,e.notes,p.finalNotes].filter(x=>x&&x.trim());
 const value=x=>safe(x||'nicht erfasst');
 return `<article class="reportSheet compactReport summaryReport"><div class="reportBrand">ABLEITCHECK ${APP_VERSION} · ZUSAMMENFASSUNG</div><h1>Prüfung der Ableitbedingungen</h1>
 <div class="summaryObject"><p><b>Objekt</b><br>${value(g.address)}</p><p><b>Datum</b><br>${value(g.date)}</p><p><b>Anlage / Leistung</b><br>${value(g.plant)} / ${N(g.power)===null?'nicht erfasst':safe(g.power)+' kW'}</p><p><b>Anlass / Anwendungsfall</b><br>${g.caseType?safe(c.case.label):'nicht erfasst'}</p></div>
 <section class="summaryResult"><div class="summaryEyebrow">ERGEBNIS DER VORPRÜFUNG</div><h2>${headline}</h2><p>${explanation}</p></section>
 ${notApplicable?'':`<h2>Was wurde betrachtet?</h2><div class="summaryCheck"><b>§ 19 der 1. BImSchV</b><p><b>Schornstein über dem eigenen Dach:</b> ${roofText}</p><p><b>Fenster, Türen und Lüftungsöffnungen:</b> ${openingText}</p></div><div class="summaryCheck"><b>Ergänzende LAI-Fachprüfung</b><p><b>Nachbargebäude und Gelände:</b> ${laiText}</p></div>`}
 <h2>${issues.length?'Was ist noch zu klären?':'Hinweise zum weiteren Vorgehen'}</h2>${issues.length?'<ul>'+[...new Set(issues)].map(t=>'<li>'+safe(t)+'</li>').join('')+'</ul>':'<p>Aus den erfassten Prüfpunkten ergibt sich derzeit kein zusätzlicher Klärungsbedarf. Weitere Anforderungen außerhalb dieser Prüfung bleiben gesondert zu beurteilen.</p>'}
 ${notes.length?'<h2>Ergänzende Hinweise / Maßnahmen</h2>'+notes.map(t=>'<p>'+safe(t)+'</p>').join(''):''}
 <footer>${safe(vdiNote(c))} Messwerte und Rechenschritte sind im ausführlichen Prüfbericht dokumentiert. Erstellt am ${new Date().toLocaleDateString('de-DE')}.</footer></article>`;
}
function prepareOnePage(){
 const area=$('#printArea');area.classList.add('measureReport');
 const sheet=area.querySelector('.compactReport');
 if(!sheet){area.classList.remove('measureReport');return true;}
 sheet.style.fontSize='9pt';
 if(sheet.scrollHeight>1030)sheet.style.fontSize='8pt';
 const fits=sheet.scrollHeight<=1030;area.classList.remove('measureReport');return fits;
}
window.addEventListener('beforeprint',()=>{if(!prepareOnePage())alert('Überlänge: Der vollständige Bericht benötigt mehr als eine A4-Seite. Keine Angaben werden abgeschnitten. Bitte Umfang prüfen oder den ausführlichen Bericht verwenden.');});

function render(){const p=state.project;if(!p)return;const c=evaluate(p);$('#mainContent').innerHTML=({start:viewStart,general:viewGeneral,building:viewBuilding,openings:viewOpenings,neighbors:viewNeighbors,environment:viewEnvironment,report:viewReport}[state.page])(p,c);if(p.migrationNotice&&!p.migrationAck){const notice=document.createElement('div');notice.className='infobox warnbox';notice.textContent=p.migrationNotice+' ';const ack=document.createElement('button');ack.className='btn mini';ack.dataset.act='ackMigration';ack.textContent='Hinweis geprüft – ausblenden';notice.append(ack);$('#mainContent').prepend(notice);}updateBackupInfo();$('#printArea').innerHTML=reportHTML(p,c);$('#projectMeta').textContent=(p.status==='abgeschlossen'?'Abgeschlossen':'Entwurf')+' · geändert '+new Date(p.updatedAt).toLocaleDateString('de-DE');document.querySelectorAll('#steps [data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===state.page));$('#btnPrev').disabled=state.page==='start';$('#btnNext').textContent=state.page==='report'?'Zur Übersicht →':'Weiter →';const options=state.projects.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).map(x=>`<option value="${safe(x.id)}" ${p.id===x.id?'selected':''}>${safe((x.general?.address||'Neues Prüfobjekt').slice(0,45))}</option>`).join('');$('#projectSelect').innerHTML=options;}
// IndexedDB: alle Daten bleiben lokal im Browserprofil. Kein automatischer Datenabgleich.
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('AbleitCheckProjectsV3',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('projects'))r.result.createObjectStore('projects',{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function txn(mode,fn){return new Promise((resolve,reject)=>{
 const t=state.db.transaction('projects',mode);let value;
 t.oncomplete=()=>resolve(value);t.onabort=()=>reject(t.error||Error('Speicherung abgebrochen'));t.onerror=()=>reject(t.error||Error('Datenbankfehler'));
 try{const r=fn(t.objectStore('projects'));r.onsuccess=()=>{value=r.result;};r.onerror=()=>reject(r.error);}catch(e){reject(e);}
});}
async function allProjects(){if(state.storageMode==='localStorage')return JSON.parse(localStorage.getItem('ableitcheck-projects-v3')||'[]');if(state.storageMode==='session')return state.projects;return txn('readonly',s=>s.getAll());}
async function writeProject(p){p.updatedAt=new Date().toISOString();if(state.storageMode==='indexeddb')await txn('readwrite',s=>s.put(p));let index=state.projects.findIndex(x=>x.id===p.id);if(index>=0)state.projects[index]=state.project?.id===p.id?state.project:p;else state.projects.push(p);if(state.storageMode==='localStorage')localStorage.setItem('ableitcheck-projects-v3',JSON.stringify(state.projects));}
async function deleteProject(id){if(state.storageMode==='indexeddb')await txn('readwrite',s=>s.delete(id));state.projects=state.projects.filter(x=>x.id!==id);if(state.storageMode==='localStorage')localStorage.setItem('ableitcheck-projects-v3',JSON.stringify(state.projects));}
const BACKUP_KEY='ableitcheck-last-backup';
function noteBackup(){try{localStorage.setItem(BACKUP_KEY,new Date().toISOString());}catch(e){}updateBackupInfo();}
function updateBackupInfo(){const el=$('#backupInfo');if(!el)return;let last=null;try{last=localStorage.getItem(BACKUP_KEY);}catch(e){}
 if(!last){el.innerHTML='<strong style="color:#a76d17">Noch keine JSON-Sicherung exportiert.</strong>';return;}
 const days=Math.floor((Date.now()-new Date(last).getTime())/864e5);
 el.innerHTML=days>=7?`<strong style="color:#a76d17">Letzte Sicherung vor ${days} Tagen – bitte „Daten sichern“.</strong>`:`Letzte Sicherung: ${days===0?'heute':'vor '+days+(days===1?' Tag':' Tagen')}.`;}
function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),3000);}
let saveChain=Promise.resolve(),saveFailed=false;
function queueSave(p){
 const snapshot=structuredClone(p);
 saveChain=saveChain.catch(()=>{}).then(()=>writeProject(snapshot)).then(()=>{saveFailed=false;$('#saveBadge').textContent='Gespeichert (lokal)';}).catch(e=>{saveFailed=true;$('#saveBadge').textContent='Speicherfehler – JSON sichern';toast('Speichern fehlgeschlagen. Daten jetzt exportieren.');throw e;});
 return saveChain;
}
let liveResultTimer=null;
function updateResultsAutomatically(){
 clearTimeout(liveResultTimer);
 liveResultTimer=setTimeout(()=>{
  if(!state.project)return;
  const main=$('#mainContent'),active=document.activeElement;
  const field=main.contains(active)?active.dataset.field:null;
  const selection=field&&typeof active.selectionStart==='number'?[active.selectionStart,active.selectionEnd,active.selectionDirection]:null;
  const scrollX=window.scrollX,scrollY=window.scrollY;
  // Keep existing input elements, including partially entered numbers and caret.
  const fields=new Map([...main.querySelectorAll('[data-field]')].map(el=>[el.dataset.field,el]));
  render();
  for(const el of main.querySelectorAll('[data-field]')){const old=fields.get(el.dataset.field);if(old&&old.tagName===el.tagName&&old.type===el.type)el.replaceWith(old);}
  if(field){const target=[...main.querySelectorAll('[data-field]')].find(el=>el.dataset.field===field);if(target){target.focus({preventScroll:true});if(selection)target.setSelectionRange(...selection);}}
  window.scrollTo(scrollX,scrollY);
 },250);
}
function scheduleSave(){
 $('#saveBadge').textContent='Noch nicht gespeichert …';clearTimeout(state.saveTimer);
 const p=state.project;
 state.saveTimer=setTimeout(()=>{state.saveTimer=null;queueSave(p).catch(()=>{});},450);
}
async function flushSave(){if(state.saveTimer){clearTimeout(state.saveTimer);state.saveTimer=null;await queueSave(state.project);}else await saveChain;}
window.addEventListener('beforeunload',e=>{if(state.saveTimer||saveFailed){e.preventDefault();e.returnValue='';}});
function patchCurrentFromDOM(){document.querySelectorAll('[data-field]').forEach(el=>setPath(state.project,el.dataset.field,el.value));}
async function navigate(page){patchCurrentFromDOM();await flushSave();state.page=page;render();window.scrollTo({top:0,behavior:'instant'});}
// Speichername aus dem Prüfobjekt: Adresse + Datum, für Dateisysteme bereinigt.
function objectFileName(p,prefix=''){
  const addr=String(p?.general?.address||'').trim()||'Prüfobjekt';
  const clean=addr.replace(/[\\/:*?"<>|#%&{}$!'@+`=]/g,' ').replace(/\s+/g,' ').trim().slice(0,60).trim();
  const d=String(p?.general?.date||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const date=d?`${d[3]}.${d[2]}.${d[1]}`:new Date().toLocaleDateString('de-DE');
  return (prefix?prefix+' ':'')+clean+' '+date;
}
function printWithTitle(title){const old=document.title;document.title=title;const restore=()=>{document.title=old;window.removeEventListener('afterprint',restore);};window.addEventListener('afterprint',restore);window.print();setTimeout(restore,60000);}
function fileDownload(name,data,mime='application/json'){const b=new Blob([data],{type:mime});let link=document.createElement('a');link.href=URL.createObjectURL(b);link.download=name;document.body.appendChild(link);link.click();setTimeout(()=>{URL.revokeObjectURL(link.href);link.remove();},1000);}
function backupData(){return JSON.stringify({format:'ableitcheck-backup',version:3,exportedAt:new Date().toISOString(),projects:state.projects},null,2);}
function normalizeProject(p){
 if(!p||typeof p!=='object'||Array.isArray(p)||typeof p.id!=='string'||!p.general||!p.building||!Array.isArray(p.openings)||!Array.isArray(p.neighbors))throw Error('Fehlerhaftes Prüfobjekt');
 p=migrateProject32(p);
 const base=blankProject();base.migrationNotice=typeof p.migrationNotice==='string'?p.migrationNotice:'';base.migrationAck=p.migrationAck===true;
 function fields(def,v){if(!v||typeof v!=='object'||Array.isArray(v))throw Error('Fehlerhafter Datenblock');const r={};for(const k of Object.keys(def)){const x=v[k];if(x!==undefined && typeof x!=='string' && typeof x!=='number' && x!==null)throw Error('Ungültiges Feld '+k);r[k]=x==null?def[k]:String(x);}return r;}
 if(p.openings.length>500||p.neighbors.length>500)throw Error('Zu viele Datensätze');
 base.general=fields(base.general,p.general);base.building=fields(base.building,p.building);base.environment=fields(base.environment,p.environment||{});
 base.openings=p.openings.map(o=>fields(blankOpening(),o));base.neighbors=p.neighbors.map(n=>fields(blankNeighbor(),n));
 base.openingsSurvey=String(p.openingsSurvey||'unk');base.finalNotes=String(p.finalNotes||'');
 const photos=p.photos||[];if(!Array.isArray(photos)||photos.length>12)throw Error('Ungültige Fotoliste');
 base.photos=photos.map(ph=>{if(!ph||typeof ph.dataUrl!=='string'||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(ph.dataUrl)||ph.dataUrl.length>6000000)throw Error('Ungültiges Foto');return {id:blankOpening().id,name:String(ph.name||'Foto'),dataUrl:ph.dataUrl};});
 base.status='entwurf';base.general.address+=(base.general.address?' ':'')+'(Importkopie)';return base;
}
async function importData(file){
 if(file.size>50000000)throw Error('Sicherung größer als 50 MB');
 const raw=JSON.parse(await file.text());if(!['ableitcheck-backup','ableitcheck-project'].includes(raw?.format)||![1,3].includes(raw.version))throw Error('Unbekanntes Sicherungsformat oder Version');
 const list=raw.format==='ableitcheck-project'?[raw.project]:raw.projects;if(!Array.isArray(list)||!list.length||list.length>500)throw Error('Ungültige Projektliste');
 const clean=list.map(normalizeProject); // Entire file validated before the first write.
 await flushSave();
 if(state.storageMode==='indexeddb')await new Promise((resolve,reject)=>{const t=state.db.transaction('projects','readwrite');t.oncomplete=resolve;t.onabort=()=>reject(t.error);t.onerror=()=>reject(t.error);const st=t.objectStore('projects');for(const p of clean)st.put(p);});
 else if(state.storageMode==='localStorage')localStorage.setItem('ableitcheck-projects-v3',JSON.stringify([...state.projects,...clean]));
 state.projects.push(...clean);state.project=clean[0];render();toast('Import als neue Entwürfe; vorhandene Objekte bleiben erhalten.');
}
async function resizePhoto(file){const blob=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});const img=new Image();img.src=blob;await img.decode();let r=Math.min(1,1400/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*r);canvas.height=Math.round(img.height*r);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.73);}
async function act(action,id){const p=state.project;switch(action){case 'addOpening':p.openings.push(blankOpening());break;case 'removeOpening':p.openings=p.openings.filter(x=>x.id!==id);break;case 'addNeighbor':p.neighbors.push(blankNeighbor());break;case 'removeNeighbor':p.neighbors=p.neighbors.filter(x=>x.id!==id);break;case 'removePhoto':p.photos=p.photos.filter(x=>x.id!==id);break;case 'duplicate':{const copy=structuredClone(p);copy.id=blankProject().id;copy.general.address=(copy.general.address||'Prüfobjekt')+' (Kopie)';copy.createdAt=new Date().toISOString();copy.closedAt=null;copy.status='entwurf';await writeProject(copy);state.project=copy;toast('Kopie angelegt.');break;}case 'deleteProject':{if(!confirm(`Prüfobjekt „${p.general.address||'ohne Adresse'}“ endgültig aus diesem Browser löschen?`))return;await deleteProject(p.id);if(!state.projects.length){let x=blankProject();await writeProject(x);}state.project=state.projects[0];toast('Prüfobjekt gelöscht.');break;}case 'downloadProject':fileDownload(objectFileName(p)+'.json',JSON.stringify({format:'ableitcheck-project',version:3,project:p},null,2));toast('Prüfobjekt exportiert.');return;case 'close':{const calc=evaluate(p);if(calc.overall!=='ok'){if(!confirm('Es gibt offene/negative Prüfpunkte. Trotzdem als INTERN BEARBEITET abschließen? Im Bericht bleiben diese ausdrücklich sichtbar.'))return;}p.status='abgeschlossen';p.closedAt=new Date().toISOString();toast('Intern als bearbeitet markiert.');break;}case 'reopen':p.status='entwurf';p.closedAt=null;toast('Erneut zur Bearbeitung geöffnet.');break;case 'ackMigration':p.migrationAck=true;toast('Hinweis als geprüft vermerkt. Im ausführlichen Bericht bleibt er dokumentiert.');break;case 'detail':patchCurrentFromDOM();await flushSave();$('#printArea').innerHTML=detailedReportHTML(p,evaluate(p));printWithTitle(objectFileName(p,'Prüfbericht Ableitbedingungen'));return;case 'print':patchCurrentFromDOM();await flushSave();$('#printArea').innerHTML=reportHTML(p,evaluate(p));if(!prepareOnePage()){alert('Überlänge: Alle Angaben bleiben erhalten. Der Bericht passt nicht lesbar auf eine A4-Seite. Bitte Anmerkungen kompakter formulieren oder den ausführlichen Bericht verwenden.');return;}printWithTitle(objectFileName(p,'Ableitbedingungen'));return;default:return;}scheduleSave();render();}
async function init(){
 try { state.db=await openDB();state.storageMode='indexeddb'; }
 catch(e){try{localStorage.setItem('__ableitcheck_test','ok');localStorage.removeItem('__ableitcheck_test');state.storageMode='localStorage';}
 catch(err){state.storageMode='session';} }
 try {state.projects=await allProjects();for(let i=0;i<state.projects.length;i++){const old=state.projects[i];if(old.schemaVersion!==32){const migrated=migrateProject32(old);await writeProject(migrated);}}if(!state.projects.length){const fresh=blankProject();await writeProject(fresh);}state.project=state.projects[0];}
 catch(e){state.storageMode='session';state.projects=[blankProject()];state.project=state.projects[0];}
 $('#storageBadge').textContent=state.storageMode==='session'?'ACHTUNG: nur Sitzung, bitte JSON exportieren':state.storageMode==='localStorage'?'Lokale Basis-Speicherung':'Nur auf diesem Gerät gespeichert';render();
 document.querySelector('#mainContent').addEventListener('compositionend',()=>updateResultsAutomatically());
 document.querySelector('#mainContent').addEventListener('input',e=>{if(e.target.matches('[data-field]')){setPath(state.project,e.target.dataset.field,e.target.value);if(state.project.status==='abgeschlossen'){state.project.status='entwurf';state.project.closedAt=null;}scheduleSave();refreshAnglePanels();refreshQuarterPanels();if(!e.isComposing)updateResultsAutomatically();}});
 document.querySelector('#mainContent').addEventListener('change',e=>{if(e.target.matches('[data-field]')){setPath(state.project,e.target.dataset.field,e.target.value);if(state.project.status==='abgeschlossen'){state.project.status='entwurf';state.project.closedAt=null;}scheduleSave();updateResultsAutomatically();}});
 document.querySelector('#mainContent').addEventListener('click',async e=>{const button=e.target.closest('[data-go],[data-act]');if(!button)return;if(button.dataset.go){await navigate(button.dataset.go);}else{patchCurrentFromDOM();await act(button.dataset.act,button.dataset.id);}});
 document.querySelector('#mainContent').addEventListener('change',async e=>{if(e.target.id==='photoUpload'){const files=Array.from(e.target.files||[]);if(!files.length)return;if(state.project.photos.length+files.length>12){toast('Maximal 12 Fotos pro Prüfung (erste Version).');return;}for(let f of files){if(!f.type.startsWith('image/'))continue;try{const dataUrl=await resizePhoto(f);state.project.photos.push({id:'ph'+Math.random().toString(36).slice(2),name:f.name,dataUrl});}catch(err){toast('Foto konnte nicht verarbeitet werden.');}}scheduleSave();render();}});
 $('#steps').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)navigate(b.dataset.go);});
 $('#btnPrev').onclick=()=>navigate(names[Math.max(0,names.indexOf(state.page)-1)]);
 $('#btnNext').onclick=()=>navigate(names[(names.indexOf(state.page)+1)%names.length]);
 $('#btnNew').onclick=async()=>{await flushSave();let x=blankProject();await writeProject(x);state.project=x;state.page='general';render();toast('Neues Prüfobjekt angelegt.');};
 $('#projectSelect').onchange=async e=>{await flushSave();state.project=state.projects.find(x=>x.id===e.target.value)||state.project;state.page='start';render();};
 $('#btnExport').onclick=async()=>{try{await flushSave();}catch(e){toast('Sicherung enthält den aktuellen Arbeitsspeicher trotz Speicherfehler.');}{const n=state.projects.length;const base=state.project?objectFileName(state.project):'AbleitCheck Sicherung '+new Date().toLocaleDateString('de-DE');fileDownload(base+(n>1?` (+${n-1} weitere)`:'')+'.json',backupData());}noteBackup();toast('Gesamtsicherung exportiert.');};
 $('#fileImport').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{await importData(f);}catch(err){toast('Import fehlgeschlagen: '+err.message);}e.target.value='';};
 try{navigator.storage?.persist?.().catch(()=>{});}catch(e){}
 if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('./sw.js').catch(console.warn);
}
globalThis.AbleitCheckTest={N,effectiveCase,vdiNote,objectFileName,reportHTML,detailedReportHTML,blankProject,blankNeighbor,openingRequirement,roofCheck,quarterRadius,neighborCheck,evaluate,normalizeProject,quarterCircleSVG,migrateProject31,migrateProject32,roofAngle,angleFactorClass,anglePanel};
init();
